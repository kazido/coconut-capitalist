[skills.taunt]
name = "Taunt"
description = "Make every enemy hit you for 2 turns, and send back some of the damage. Spends guard."
target = "self"
cooldown = 3
cost = 20
effects = [{ kind = "taunt", on = "self", turns = 2 }, { kind = "reflect", on = "self", turns = 2, value = 0.3 }]

