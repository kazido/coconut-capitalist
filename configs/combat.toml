[skills.chain_lightning]
name = "Chain Lightning"
description = "Lightning that arcs on to a second enemy. Shatters a chilled target."
power = 1.1
target = "enemy"
cooldown = 2
cost = 30
element = "storm"

[skills.blizzard]
name = "Blizzard"
description = "A freezing storm: hits everyone and slows them."
power = 0.5
target = "all_enemies"
cooldown = 3
cost = 40
element = "frost"
effects = [{ kind = "chill", chance = 80, turns = 2, value = 0.3 }]

[skills.meteor]
name = "Meteor"
description = "A huge fiery blow."
power = 2.4
cooldown = 4
cost = 60
element = "fire"

[skills.bash]
name = "Bash"
description = "A shield bash. Builds guard."
power = 0.9
gain = 10

[skills.shield_wall]
name = "Shield Wall"
description = "Shield yourself or an ally for 25% of your max hp. Spends guard."
target = "ally"
cooldown = 3
cost = 30
effects = [{ kind = "shield", value = 0.25 }]

[skills.retaliate]
name = "Retaliate"
description = "A hard hit, then counter every foe that hits you for 2 turns. Spends guard."
power = 1.2
cooldown = 3
cost = 40
