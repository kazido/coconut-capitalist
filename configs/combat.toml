# --- the four classes: the weapon in the combat slot picks one (bare hands use [kits].default) ------------------------------
# Each kit lists skills in button order: the first is level 0 with no cooldown, the rest unlock at that combat level. TODO(balance)
# --- class resources: how each fills (TODO(balance): all numbers) --------------------------------------------------------
[resources.rage]       # Melee: skills with `gain` build it, and so does every hit you take
on_hit_taken = 8
[resources.focus]      # Archer: builds each turn you weren't hurt; every point is +crit chance
per_unhurt_turn = 15
crit_per_point = 0.3   # percent per point: full focus = +30% crit
[resources.mana]       # Wizard: starts full and refills a bit every turn
start = 100
per_turn = 15
[resources.guard]      # Tank: builds when you are hit (and from Bash/Brace)
on_hit_taken = 12

# --- elements: frost chills, fire burns, storm chains ---------------------------------------------------------------------
[elements]
shatter = 1.5          # a fire or storm hit on a chilled target deals x this and ends the chill
chain = 0.5            # a single-target storm hit also hits one other enemy for x this

[classes.melee]
name = "Melee"
weapon = "sword"
resource = "rage"
resource_max = 100
description = "Rage builds when you hit or get hit; finishers spend it. Burst on one target."
kit = [{ skill = "slash", level = 0 }, { skill = "cleave", level = 3 }, { skill = "guard_break", level = 6 }, { skill = "quick_step", level = 10 }, { skill = "rampage", level = 15 }]

[classes.archer]
name = "Archer"
weapon = "bow"
resource = "focus"
resource_max = 100
description = "Focus builds each turn you stay unhurt or Aim; Power Shot spends it. Crits, speed and meter pull."
kit = [{ skill = "quick_shot", level = 0 }, { skill = "aim", level = 3 }, { skill = "power_shot", level = 6 }, { skill = "volley", level = 10 }, { skill = "quick_step", level = 14 }]

[classes.wizard]
name = "Wizard"
weapon = "staff"
resource = "mana"
resource_max = 100
description = "Mana refills each turn; spells cost it. Frost chills, fire burns, storm chains. Area damage and debuffs."
kit = [{ skill = "frost_bolt", level = 0 }, { skill = "fireball", level = 3 }, { skill = "chain_lightning", level = 6 }, { skill = "blizzard", level = 10 }, { skill = "meteor", level = 15 }]

[classes.tank]
name = "Tank"
weapon = "shield"
resource = "guard"
resource_max = 100
description = "Guard builds when you are hit or Brace; spend it on defensive and counter skills. Carries the party at the boss."
kit = [{ skill = "bash", level = 0 }, { skill = "brace", level = 3 }, { skill = "shield_wall", level = 6 }, { skill = "taunt", level = 10 }, { skill = "retaliate", level = 14 }]

# --- bare hands (the first skill is the basic, with no cooldown) ------------------------------------------
[kits]
default = ["slash"]  # bare hands

# --- fights you can pick -------------------------------------------------------------------------------------------------
[encounters.gravewarden]
