# Combat: Summoners War style. Every unit has a SPEED; its turn meter fills by that much per tick and the first to reach
# meter_full acts. Skills have cooldowns instead of costs, so there are no consumables. TODO(balance): all numbers.
meter_full = 100
defense_scale = 100  # damage = attack x skill power x 100 / (100 + defense)
crit_chance = 15     # percent
crit_damage = 1.5
max_rounds = 150     # total turns (everyone's) before a fight counts as lost

[player]
base_hp = 120
hp_per_level = 12
base_attack = 8                   # (a weapon adds its own attack per power point, see configs/tools.toml; bare hands add none)
attack_per_level = 1
base_defense = 10
defense_per_level = 1
speed = 100

# --- skills -------------------------------------------------------------------------------------------------------
[skills.bone_strike]
name = "Bone Strike"
description = "A crushing swing."
power = 1.0

[skills.strike]
name = "Strike"
description = "A plain hit."
power = 1.0

[skills.slash]
name = "Slash"
description = "A clean cut. Builds rage."
power = 1.0
gain = 10

[skills.cleave]
name = "Cleave"
description = "Hit every enemy for a little less."
power = 0.7
target = "all_enemies"
cooldown = 3
gain = 10

[skills.guard_break]
name = "Guard Break"
description = "A heavy blow that leaves the enemy's guard down for 2 turns."
power = 1.3
cooldown = 4
gain = 15
effects = [{ kind = "defense_down", turns = 2, value = 0.5 }]

[skills.quick_step]
name = "Quick Step"
description = "Move faster for 2 turns and take a step toward your next turn."
target = "self"
cooldown = 4
effects = [{ kind = "speed_up", on = "self", turns = 2, value = 0.3 }, { kind = "meter", on = "self", value = 0.3 }]

[skills.brace]
name = "Brace"
description = "Quadruple your defense for 2 turns: hits hurt about half as much. Use it when you can see a big one coming."
target = "self"
cooldown = 3
gain = 20
effects = [{ kind = "defense_up", on = "self", turns = 2, value = 3.0 }]

[skills.sanguine_priming]
name = "Sanguine Priming"
description = "Prime the blade: your next damaging skill deals double."
target = "self"
cooldown = 4
effects = [{ kind = "empower", on = "self", turns = 3, value = 2.0 }]

[skills.enter_the_mind]
name = "Enter the Mind"
description = "Strike at a foe's mind. For 3 turns you see what every enemy will do next."
power = 1.1
cooldown = 4
effects = [{ kind = "reveal", on = "self", turns = 3 }]

[skills.glistening_haven]
name = "Glistening Haven"
description = "Strike, then heal yourself for 25% of your max hp."
power = 1.2
cooldown = 3
effects = [{ kind = "heal", on = "self", value = 0.25 }]

# --- class skills (cost/gain/element are stored for the resource engine; TODO(balance): all numbers) ---------------------
[skills.rampage]
name = "Rampage"
description = "A furious finisher. Spends rage."
power = 2.2
cooldown = 2
cost = 50

[skills.quick_shot]
name = "Quick Shot"
description = "A fast arrow. Builds focus."
power = 1.0
gain = 5

[skills.aim]
name = "Aim"
description = "Line up the shot: faster for 2 turns and your next hit lands harder."
target = "self"
cooldown = 3
gain = 20
effects = [{ kind = "speed_up", on = "self", turns = 2, value = 0.2 }, { kind = "empower", on = "self", turns = 3, value = 1.3 }]

[skills.power_shot]
name = "Power Shot"
description = "A heavy arrow. Spends focus."
power = 1.9
cooldown = 2
cost = 40

[skills.volley]
name = "Volley"
description = "Rain arrows on every enemy."
