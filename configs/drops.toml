# Drop tables: what a kill (or, soon, a channel drop) can give. One entry is picked by WEIGHT (bigger = likelier), and an entry
# is either bits (bits_min..bits_max) or an item (min..max of it, skewed toward min). An enemy's `drop_chance` is the percent
# chance a kill drops anything at all, so the real odds of an entry are drop_chance x weight / total weight.
# Rarer things (scrolls, orbs, deeds, Spirits) have tiny weights. TODO(balance): all of it.

# Everything in the graveyard. A key is about 1 in 30 kills; an orb about 1 in 350.
[graveyard]
entries = [
    { weight = 400, bits_min = 3000, bits_max = 9000 },
    { weight = 140, item = "iron_ore", min = 2, max = 6 },
    { weight = 100, item = "hardwood", min = 1, max = 4 },
    { weight = 80, item = "plant_fiber", min = 2, max = 8 },
    { weight = 60, item = "coral_shard", min = 1, max = 3 },
    { weight = 60, item = "gold_ore", min = 1, max = 3 },
    { weight = 40, item = "shrimp", min = 1, max = 2 },
    { weight = 30, item = "fine_bark" },
    { weight = 45, item = "graveyard_key" },
    { weight = 6, item = "scroll_keen" },
    { weight = 6, item = "scroll_sharp_eye" },
    { weight = 6, item = "scroll_iron_frame" },
    { weight = 4, item = "familiar_orb" },
    { weight = 2, item = "land_deed" },
]

# The Gravewarden always drops something, and it is good.
[gravewarden]
entries = [
    { weight = 300, bits_min = 200000, bits_max = 500000 },
    { weight = 150, item = "gold_ore", min = 20, max = 60 },
    { weight = 150, item = "fine_bark", min = 5, max = 15 },
    { weight = 60, item = "maple_leaf", min = 1, max = 3 },
    { weight = 60, item = "scroll_keen" },
    { weight = 60, item = "scroll_sharp_eye" },
    { weight = 60, item = "scroll_iron_frame" },
    { weight = 50, item = "familiar_orb" },
    { weight = 25, item = "spirit_of_the_sword" },
    { weight = 60, item = "graveyard_key" },
]
