[dragon]
name = "Dragon"
emoji = "🐉"
rarity = 5
description = "Hoards treasure, and can smell it. Hallucinations and chests come more often."
[[dragon.bonuses]]
stat = "treasure_luck"
value = 0.35
text = "+{v:.0%} hallucination and chest chance"
