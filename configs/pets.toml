# Every pet has ONE skill (shown as an emoji after its name): "global" for pets whose bonus works everywhere (work wage, all-skill xp)
# and a skill name for the rest. Food of its skill is worth x3 to it; a global pet gets x2 from any food. A bonus `value` is what the
# pet gives at level 100 with one star: a fresh pet gives a tenth of it, and every extra star adds +25%, so a five-star level-100 pet gives double.
# Pets: collected from Familiar Orbs (a duplicate adds a star), fed crops to level up. One is active at a time, and its bonuses
# apply everywhere in the game. A bonus is `value` x stars x level (see [pets] in economy.toml). TODO(balance): all of it

[cinder]
name = "Cinder"
skill = "global"
emoji = "🐕"
rarity = 1
ability = "none"
description = "A faithful glow in the grey. Pays you a bit extra every shift."
[cinder.loadout]
tool_tier = 0
mastery_score = 2
enchants = {}
[[cinder.bonuses]]
stat = "work_bonus"
value = 0.2
text = "+{v:.0%} bits from Work"

