# Enchants are stored on a player's tool as {enchant_id: level}. An enchant can be crafted, bought or found;
# this file only says what it DOES. effects: stat_add (+amount*level), stat_mult (x(1+amount*level)), flag.
# Known stats: power. Known flags: soloist (foraging: no half-power penalty on heavy zone 7+ trees when chopping alone).

[soloist]
name = "Soloist"
emoji = "🧍"
description = "Heavy trees (forest 7 and up) are no harder for you to chop alone: no half-power penalty."
applies_to = ["axe"]
max_level = 1

[[soloist.effects]]
type = "flag"
flag = "soloist"

[steady_line]
name = "Steady Line"
emoji = "🧵"
description = "Forgives one more wrong arrow per level while reeling."
applies_to = ["rod"]
max_level = 2

[[steady_line.effects]]
type = "stat_add"
stat = "slips"
amount = 1

[net_cast]
name = "Net Cast"
emoji = "🥅"
description = "Once per fishing trip (each visit to the Fishing page, or each new water), a Net button hauls in 3 of the water's commonest fish at once."
applies_to = ["rod"]
max_level = 1

[[net_cast.effects]]
type = "stat_add"
stat = "net_cast"
amount = 1.0

[double_hook]
name = "Double Hook"
emoji = "⚡"
description = "After you land a fish, a 4% chance per level that a second line is already biting: a free Quick cast in the same water (you have a few seconds to take it; ignoring it costs nothing)."
applies_to = ["rod"]
max_level = 3

[[double_hook.effects]]
type = "stat_add"
stat = "double_hook"
amount = 0.04

[double_strike]
name = "Double Strike"
emoji = "⚡"
description = "Your axe sometimes bites twice: 8% chance per level that a chop hits twice as hard (it is still one swing, so it pays the same xp)."
applies_to = ["axe"]
max_level = 3

[[double_strike.effects]]
type = "stat_add"
stat = "double_chop"
amount = 0.08

[seedkeeper]
name = "Seedkeeper"
emoji = "🫘"
description = "More plants go to seed: +4% chance per level that a harvest gives its seed back."
applies_to = ["can"]
max_level = 3

[[seedkeeper.effects]]
type = "stat_add"
stat = "seed_back"
amount = 0.04

[echo_strike]
name = "Echo Strike"
emoji = "🔁"
description = "Your pick echoes: 6% chance per level that a dug tile also breaks the tile beside it (you get its loot, it adds no pressure)."
applies_to = ["pickaxe"]
max_level = 3  # TODO(balance): the 6% per level is a guess

[[echo_strike.effects]]
type = "stat_add"
stat = "echo_strike"
amount = 0.06

[second_wind]
name = "Second Wind"
emoji = "🌬️"
description = "Once per mine, a collapse is held off for a moment: press Brace! to save the tunnel (no brace used)."
applies_to = ["pickaxe"]
max_level = 1

[[second_wind.effects]]
type = "stat_add"
stat = "second_wind"
amount = 1.0

[prospectors_ping]
name = "Prospector's Ping"
emoji = "📡"
description = "Once per mine, Ping reveals the three tiles straight below your cursor."
applies_to = ["pickaxe"]
max_level = 1

[[prospectors_ping.effects]]
type = "stat_add"
stat = "prospectors_ping"
amount = 1.0

[timber]
name = "Timber!"
emoji = "🪵"
description = "Your axe can topple a tree: a percent chance per level that a tree you fell crashes into the next one, which starts half chopped."
applies_to = ["axe"]
max_level = 3  # TODO(balance): the chance per level is a guess

[[timber.effects]]
type = "stat_add"
stat = "timber"
amount = 0.05

[ember_bite]
name = "Ember Bite"
emoji = "🔥"
description = "A chop can set the trunk smouldering: a percent chance per level, then the next chops on that tree hit harder."
applies_to = ["axe"]
max_level = 3  # TODO(balance): the chance per level is a guess

[[ember_bite.effects]]
type = "stat_add"
