# Farming rules (see the wiki). Balance data: change numbers freely.  # TODO(balance): all numbers are guesses
#
# Every hour it "rains". Each planted seed grows one cycle with `grow_chance` (a seed needs `cycles` of them, see
# items.toml). Growth is worked out from the clock when you look at your farm, so rain keeps falling while the
# bot is offline and no background job is needed.

free_plots = 3                    # plot 1 is yours from the start; plots 2-9 each cost one land deed
grow_chance = 0.5                 # per rain, per growing plot
blessing_chance = 0.1             # per rain in which any of your crops grew: a rain god's blessing (wiki: 1/10)
water_chance = 1.0                # WATER your plots (a button, once an hour per plot): each ALWAYS grows a cycle, on top of the rain. How many plots your can waters an hour is its power
drop_cycles_per_roll = 2          # a harvest rolls the farming drop table once per 2 growth cycles of the crop (apple 0.5, lemon 2, coconut 50)...
max_drop_rolls = 60               # ...up to this many
anomaly_odds = 25                 # 1 in N per harvest: refreshes your work and daily cooldowns (wiki: 1/25)
xp_per_cycle = 300               # farming xp for a harvest = the crop's growth cycles x this (apple 300, coconut 30,000). Tools never change xp
deed_item = "key_land_deed"
# Tend: every growth cycle a growing plot makes byproducts (the farming drop table: plant fiber, compost, dewdrops, beeswax, living vines), collected with the Tend
# button. A plot keeps at most `byproduct_max_cycles` cycles waiting, so you get them all by checking in about every 3 hours. `byproduct_rolls` = rolls of the drop
# table per cycle, by field (the same order as field_seeds); one full roll of the table is worth about 618 bits, set so a crop's byproducts are about 15-40% of what
# the crop itself earns an hour (a guard test keeps it). Later fields also roll starred materials (services/stars.py). Xp is NOT paid for tending: it stays at xp_per_cycle per cycle at harvest.
byproduct_max_cycles = 3
byproduct_rolls = [4, 6, 8, 10, 10, 10, 12, 12, 4, 14, 14, 14, 16, 18]
# The crop each of the 14 fields (configs/locations.toml [farming], in order) opens. A field is open once you have the farming level
# (areas.toml [locations]) AND have reached its area; until then its seed is not sold. Seeds you got from drops or trades still plant.
field_seeds = [
    "seed_apple", "seed_lemon", "seed_blueberry", "seed_dusty_dandelion", "seed_rustroot", "seed_hot_pepper", "seed_watermelon",
    "seed_marketfig", "seed_wilted_rose", "seed_cloudberry", "seed_starfruit", "seed_coconut", "seed_voidbloom", "seed_ambrosia",
]

[starter_seeds]                   # a free gift, once, the first time you open your farm, so you can plant straight away
seed_apple = 3

[market]                          # the Farmer's Market
min_level = 5
opens = [1, 13]                   # opens every day at each of these UTC hours: 20:00 and 08:00 EST, 02:00/14:00 CET, 10:00/22:00 JST (TODO(balance))
open_hours = 2                    # and each time stays open this many hours (TODO(balance))
price_bonus = 0.5                 # crops sell for +50% while it is open
deed_chance = 0.1                 # each blessing you deposit has this chance to become a land deed (wiki: 1/10)
