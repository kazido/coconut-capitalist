# Farming rules (see the wiki). Balance data: change numbers freely.  # TODO(balance): all numbers are guesses
#
# Every hour it "rains". Each planted seed grows one cycle with `grow_chance` (a seed needs `cycles` of them, see
# items.toml). Growth is worked out from the clock when you look at your farm, so rain keeps falling while the
# bot is offline and no background job is needed.

free_plots = 1                    # plot 1 is yours from the start; plots 2-9 each cost one land deed
grow_chance = 0.5                 # per rain, per growing plot
blessing_chance = 0.1             # per rain in which any of your crops grew: a rain god's blessing (wiki: 1/10)
water_chance = 1.0                # WATER your plots (a button, once an hour per plot): each ALWAYS grows a cycle, on top of the rain. How many plots your can waters an hour is its power
drop_cycles_per_roll = 2          # a harvest rolls the farming drop table once per 2 growth cycles of the crop (apple 0.5, lemon 2, coconut 50)...
max_drop_rolls = 60               # ...up to this many
anomaly_odds = 25                 # 1 in N per harvest: refreshes your work and daily cooldowns (wiki: 1/25)
xp_per_cycle = 500               # farming xp for a harvest = the crop's growth cycles x this (apple 500, coconut 50,000). Tools never change xp
deed_item = "land_deed"

[starter_seeds]                   # a free gift, once, the first time you open your farm, so you can plant straight away
apple_seed = 3

[market]                          # the Farmer's Market
min_level = 5
days = [4, 5]                     # Friday and Saturday (0 = Monday), UTC
price_bonus = 0.5                 # crops sell for +50% while it is open
deed_chance = 0.1                 # each blessing you deposit has this chance to become a land deed (wiki: 1/10)
