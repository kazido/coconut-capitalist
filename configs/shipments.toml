# Shipments: fill a crate with materials from the skills and ship it for xp and bits. Shipping one fills its slot with a new one.
# Each skill has a basic and a harder crate that unlock with that skill's level. There is also a weekly
# COMMUNITY shipment the whole server fills (off for now). Everything here is balance data.  TODO(balance)

[personal]
foreign_share = 0.10             # the materials from OTHER skills are only this share of a crate's value in total (the home skill is the bulk)
foreign_max_quantity = 12         # ...and never more than this many of one of them, so it cannot be a pile of the cheapest ore
rate_per_level = 8                # a skill's finds this common (one every N minutes of active play, N up to 5 + this x your level) can be asked for: nothing rare at low levels

# Every skill has one crate of each tier once its OWN level reaches `unlock_level`. A crate asks for `kinds` materials, `theme_kinds` of them from its own skill (the rest
# from other skills), and is sized by that skill's level, so a player at the unlock level can finish it. Shipping pays `bits_factor` x what the materials would sell for.
[personal.tiers.basic]
unlock_level = 10
kinds = 4
theme_kinds = 3
value_base = 40000                # bits' worth of materials at skill level 1...
value_per_level = 4000            # ...plus this per level of the skill
bits_factor = 1.3
xp_per_bit = 0.012                # xp = the materials' worth x this, paid in the skills the materials came from

[personal.tiers.hard]
unlock_level = 30
kinds = 5
theme_kinds = 4
value_base = 160000               # about four times the basic crate at the same level (and by then you can be asked for rarer finds)
value_per_level = 16000
bits_factor = 1.5
xp_per_bit = 0.015

[community]
enabled = false                  # scrapped for now: the page does not show it (the rules stay, in case it comes back)
value_per_player = 1200000        # bits' worth of materials each RECENTLY ACTIVE player adds to the week's goal...
value_per_level = 60000           # ...plus this per average skill level of those players (so it grows as the server does)
active_days = 7                   # "recently active" = pressed something in the last this-many days (counted when the week starts)
min_players = 3                   # a quiet server is still asked for at least this many players' worth
kinds = 6
min_share = 0.02                  # you need to have given at least this much of it to be paid when it is finished
bits_factor = 1.5                 # finishing pays each giver this x the worth of what THEY gave (so giving beats selling)...
xp = 6000                         # ...and this much xp in the skill they gave most of
