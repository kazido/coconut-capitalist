# Shipments: fill a crate with materials from the skills and ship it for xp and bits. You always have `slots` of them; shipping one fills its slot with a new one.
# Two are THEMED (mostly one skill's materials, so they favour what you are good at) and one is MIXED (materials from different skills). There is also a weekly
# COMMUNITY shipment the whole server fills. Everything here is balance data.  TODO(balance)

[personal]
slots = 3                         # two themed and one mixed
kinds = 4                         # different materials in a shipment
theme_kinds = 3                   # a themed shipment asks for this many kinds from its skill (the rest from other skills)
value_base = 60000                # bits' worth of materials in a shipment at level 1...
value_per_level = 6000            # ...plus this per skill level (a mixed one counts your average level)
bits_factor = 1.3                 # it pays this x what the materials would sell for: a reason to ship rather than sell (it is still bits that come from your own gathering)
xp_per_bit = 0.012                # xp = the materials' worth x this (about the xp of 10 minutes of play for a shipment): a themed one pays in its skill, a mixed one in each
rate_per_level = 8                # a skill's finds this common (1 in N, N up to 5 + this x your level) can be asked for: nothing rare at low levels

[community]
value_per_player = 1200000        # bits' worth of materials each RECENTLY ACTIVE player adds to the week's goal...
value_per_level = 60000           # ...plus this per average skill level of those players (so it grows as the server does)
active_days = 7                   # "recently active" = pressed something in the last this-many days (counted when the week starts)
min_players = 3                   # a quiet server is still asked for at least this many players' worth
kinds = 6
min_share = 0.02                  # you need to have given at least this much of it to be paid when it is finished
bits_factor = 1.5                 # finishing pays each giver this x the worth of what THEY gave (so giving beats selling)...
xp = 6000                         # ...and this much xp in the skill they gave most of
