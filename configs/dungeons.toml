# Tiered dungeons (services/dungeon.py). A dungeon key (key_dungeon_t<N>) is spent on entry; the party walks a square grid of hidden
# tiles from the top-left corner to the boss in the bottom-right one. Hp and buffs carry over between fights inside a run.
# Every number here is a first guess: TODO(balance) (combat rework step 7).

# Tile buffs: a buff tile gives one of these, picked at random. `stat = "hp"` heals that percent of max hp right away;
# the others raise the stat by `percent` for every later fight in the run (they stack).
[[buffs]]
stat = "hp"
percent = 40

[[buffs]]
stat = "attack"
percent = 15

[[buffs]]
stat = "defense"
percent = 15

[[buffs]]
stat = "speed"
percent = 10

# [tiers.N]: size = grid side; tiles = relative weights of the hidden tiles; enemies = the pool an enemy tile draws 1..max_foes from;
# boss = the boss at the end; loot = the drops.toml table a reward tile rolls `loot_rolls` times; min_level = combat level to enter.
[tiers.1]
size = 5
min_level = 0
tiles = { reward = 3, buff = 2, enemy = 4, empty = 6 }
enemies = ["zombie", "armored_zombie", "skeleton"]
max_foes = 2
boss = "gravewarden"
loot = "graveyard"
loot_rolls = 1

