# Areas and the ship (services/areas.py). The world is 7 areas; a ship takes you from one to the next.
# Every skill has 14 LOCATIONS (forests, mines, waters, fields), two per area, picked from a dropdown. Location n lives in area
# ceil(n / 2) and opens at skill level `locations.min_levels[n - 1]` (the same for every skill). To use it you must be IN that area
# (or a later one) AND have the level: the area is a ceiling, so a maxed skill still waits on the ship.
# Going to an area you have already reached is free; the FIRST trip to a new area burns its `fuel` (crafted at the Workbench,
# configs/recipes.toml) and needs ship tier N for area N. Ship tier 1 builds the ship; tier N+1 is an upgrade of tier N.
# skill_floors = the level that opens (ANY ONE skill at it is enough) the first location of the area you are sailing to (docs/plans/areas-and-ship.md).
# Fuel and ship parts mix materials from every skill on purpose, so no skill can be skipped.
# Plan: docs/plans/areas-and-ship.md.  TODO(balance): every number here is a first guess.

# Overdrive: burn any fuel you hold (you must have reached its area) for a timed boost in ALL skills: +skill xp and +drop_amount
# (the stat Bountiful uses). Burning adds `minutes` (capped at `max_minutes`); a different fuel replaces the current one.
# TODO(balance): all numbers are first guesses.
[overdrive]
minutes = 60
max_minutes = 180

[locations]
# TODO(balance): the last location opens at level 50 of 100 on purpose (the rest is mastery); fishing's old waters were 1/3/8/15.
min_levels = [1, 3, 8, 15, 19, 23, 27, 31, 35, 39, 42, 45, 48, 50]

