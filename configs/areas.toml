# Areas and the ship (services/areas.py). The world is 7 areas; a ship takes you from one to the next.
# An area CAPS how far each skill's own zones open: foraging zones 1..foraging_max_zone, fishing waters up to fishing_max_water.
# (You still need the skill level for a zone; the area is a ceiling, so a maxed skill still waits on the ship.)
# Going to an area you have already reached is free; the FIRST trip to a new area burns its `fuel` (crafted at the Workbench,
# configs/recipes.toml) and needs ship tier N for area N. Ship tier 1 builds the ship; tier N+1 is an upgrade of tier N.
# skill_floors = the level that opens the first location of the area you are sailing to (docs/plans/areas-and-ship.md).
# Fuel and ship parts mix materials from every skill on purpose, so no skill can be skipped.
# Plan: docs/plans/areas-and-ship.md.  TODO(balance): every number here is a first guess.

[area.slime_hill]
name = "Slime Hill"
emoji = "🟢"
description = "A gentle green hill where every adventure starts."
foraging_max_zone = 3
fishing_max_water = "pond"

