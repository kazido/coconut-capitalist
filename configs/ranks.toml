# Ranks, bought with tokens (1 a day from the daily, plus about 1 a day found at random while playing: see token_drop_chance in
# economy.toml). Prices climb so Expert (rank 8) takes about 3 months and the top rank about 3 years of regular play (2,150 tokens in all).
# Ranks, bought with tokens. wage is paid by the Work button (every 6 hours). The wages were cut to 30% from rank 2 up: they were most of what players held,
# next to what skills pay for the same time (an hour of mining at starter gear is about 570,000 bits), so selling what you gather barely mattered. color is hex without '#'.
# xp_bonus is a global bonus to ALL skill xp (+1% per rank, so +8% at Expert and +15% at the top). It multiplies with the
# party and pet bonuses; it is small on purpose, because it never goes away.

