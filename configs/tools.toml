# What a tool's POWER gives besides its main effect. Every upgrade should change several things at once, so it feels like a real step up.
# All of these are per point of power ABOVE 3 (every tool starts at 3, so a starter tool gets none of them). The main effects (ore per lode,
# hit points per chop, plots watered, sword attack, and the rod's bites, arrows and luck) are in mining.toml, foraging.toml, farming.toml,
# combat.toml and fishing.toml.  TODO(balance): all numbers

[pickaxe]
danger_reduction = 0.003    # tunnels creak this much less (power 71: 20% slower pressure)
rich_chance = 0.0006        # +this chance of a rich lode in every cell (power 71: +4%)
braces_every = 25           # +1 brace at the start of every dig per this many points

# The two roads of the pickaxe lean different ways. The Warden keeps the safety (extra pressure slow, braces) and has no rich-lode bonus; the Prospector gets NO pressure slow
# at all and double the rich-lode chance. (Their main numbers and abilities differ too: see the tools in items.toml.)
[pickaxe.paths.Warden]
danger_reduction = 1.6
rich_chance = 0.0
braces = 1.0
[pickaxe.paths.Prospector]
danger_reduction = 0.0
rich_chance = 2.5
braces = 0.0

[axe]
good_chop = 0.002           # +this chance of a good chop (power 54: +10%)
wear_slow = 0.005           # a plain or good grain wears out this much slower, and a BAD grain this much faster (power 54: 25%)

# The two roads of the axe. The Lumberjack lands more good chops and double chops (the Timber ability: its tools carry `double_chop`); the Forager's spots last longer and its
# chops shake loose drops (the Shake the Branches ability: `shake`). TODO(balance)
[axe.paths.Lumberjack]
good_chop = 1.6
wear_slow = 0.6
[axe.paths.Forager]
good_chop = 0.5
wear_slow = 1.6

[can]
crop_yield = 0.04           # bigger harvests (power 9: +24%)
drop_luck = 0.08            # more farming drops (power 9: +48%)
seed_back = 0.03            # the chance a harvest gives its seed back (power 9: 18%)

# The two roads of the can. The Sprinkler keeps the drops and seeds coming and waters better (`sprinkle`: watered plots are likelier to grow); the Alchemist grows bigger
# harvests and sometimes doubles one (`transmute`). TODO(balance)
[can.paths.Sprinkler]
crop_yield = 0.7
drop_luck = 1.4
seed_back = 1.4
[can.paths.Alchemist]
crop_yield = 1.5
drop_luck = 0.6
seed_back = 0.6

[sword]
hp = 3                      # extra max hp in a fight
defense = 0.25              # extra defense in a fight
