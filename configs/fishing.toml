# Double Hook: after you LAND a fish (a plain catch: never a boss, a party fight or a chest, and never after a Quick cast itself) a second line may already be biting.
# The chance is the `double_hook` stat (the Double Hook rod enchant, 4% a level, and the Double Hook Mastery node, 10%); `base_chance` is added to it for everyone.
# You get `window_seconds` to press "Quick cast!" on the result page; ignoring it costs nothing. It is a free cast in the same water with the bite already there
# (no wait, no radar battery, never a chest or boss), and pays like any catch. Each offer is worth about one more fish per cast, so a stat of 0.12 is about +12% fish.
# TODO(balance)
[double_hook]
base_chance = 0.0
window_seconds = 4
cap = 0.25                        # the offer chance never goes above this, however it stacks

# The radar: a gadget (not a rod) that makes the fish you pick likelier. Pick targets on the Radar page, keep it ON, and every cast uses one battery (only when a
