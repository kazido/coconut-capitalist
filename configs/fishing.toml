# Fishing rules (see the wiki). Balance data: change numbers freely.  # TODO(balance): all numbers are guesses
#
# Cast a line, wait for a bite, pull up the line, then reel the fish in by pressing the arrows shown, in order. A rod's power makes the
# bite come sooner and lets you slip up now and then. Which fish bites is decided when you cast (rarest rolled first,
# from the fishing items' `drop` odds), so reopening the panel can't re-roll it.

xp_per_rarity = 30               # fishing xp for a catch = the fish's rarity x this

[bite]
wait_min = 8                     # seconds until a bite at rod power 1...
wait_max = 20                    # ...somewhere between these
speedup_per_power = 0.08         # each point of rod power above 1 cuts the wait by this share (compounding as 1/(1+x))
min_wait_factor = 0.35           # ...but never below this share of the base wait
window = 6                       # seconds you have to pull up the line once it bites, or the fish gets away
grace = 3                        # ...plus this many quiet seconds, so a laggy connection or a slow bot doesn't cost you the fish

[reel]
base_length = 2                  # arrows to press = this + the fish's rarity (a rarity-1 fish takes 3)
power_per_slip = 8               # every this much rod power forgives one wrong arrow (a power-8 rod forgives one)
break_from_rarity = 2            # uncommon fish and up make you stop and press Reel now and then...
arrows_per_break = 4             # ...about once per this many arrows
mystery_from_rarity = 4          # super rare fish and up hide arrows behind a ❓ (rarity 4: one, 5: two, 6: three, 7: four)
max_random_mysteries = 2         # ...but a fish whose ❓ is a pure coin flip (can't be learned) hides at most this many
echo_window = 2                  # a second press of the arrow you JUST pressed (e.g. when the panel was slow to update) is ignored, not a slip

# Quests (fishing level `min_level`). Each slot is one quest: "catch N of a fish of this rarity". Which fish, and how many
# within the slot's range, is picked from the clock and the player, so everyone's list differs and nobody rolls
# anything. Daily quests renew at UTC midnight, the weekly one on Mondays. Finishing a quest pays at once:
# bits = the fish's sell price x N x the multiplier, xp = rarity x N x xp_per_rarity.
[quests]
min_level = 3
xp_per_rarity = 20
daily_bits_multiplier = 1.5
weekly_bits_multiplier = 3.0

[[quests.daily]]
rarity = 1
min_count = 4
max_count = 8
[[quests.daily]]
rarity = 1
min_count = 4
max_count = 8
[[quests.daily]]
rarity = 2
min_count = 1
max_count = 3
[[quests.daily]]
rarity = 2
min_count = 1
max_count = 3
[[quests.daily]]
rarity = 3
min_count = 1
max_count = 1

[[quests.weekly]]
rarity = 4
min_count = 1
max_count = 2

# The personal collection book. It holds one entry per fish up to `max_rarity` (common to super rare). Turn fish in for
# a bonus; once every entry is full you can complete the book: it pays out, goes up a level and starts over needing
# more of each fish.
[book]
min_level = 10                   # TODO(balance): the wiki says fishing level 10
max_rarity = 4
max_level = 10
need_base = 1                    # each entry needs this many fish at book level 1...
# ...and each level after asks for more, by rarity (common, uncommon, rare, super rare): need = 1 + floor((level - 1) x step).
# Level 2 needs 5 of each common fish, 3 of each uncommon, 1 of each rare and super rare. Level 5: 17, 9, 3, 2.
need_step_by_rarity = [4, 2, 0.5, 0.25]
bits_per_sell = 0.5              # turning a fish in pays +50% of what it would sell for (so it beats selling it)
xp_per_rarity = 15
completion_bits = 50000          # finishing a book pays this x the book's level...
completion_xp = 400              # ...and this much xp x its level

# Treasure. Now and then a catch brings a hallucination: four numbers flash on screen for a few seconds. While it lasts
# (`armed_minutes`), a cast can bring up a treasure chest instead of a fish, and the numbers unlock it. Forget them and
# the chest sinks. A chest pays bits, xp and rolls the loot table below.  TODO(balance): all of it
[treasure]
hallucination_odds = 35           # 1 in 35 catches (the wiki says 25: this is a little rarer)
chest_odds = 35                   # 1 in 35 casts while the hallucination lasts (as rare as the hallucination itself)
armed_minutes = 10
flash_seconds = 8
code_length = 4
attempts = 3
bits_min = 20000
bits_max = 60000
xp = 150                          # a chest pays at least this much xp...
xp_level_fraction = 0.25          # ...or a quarter of the xp it takes to finish your current level, so it stays worth opening as you grow

[[treasure.loot]]
item = "coral_shard"
min = 2
max = 6
chance = 1.0
[[treasure.loot]]
item = "sturgeon"
min = 1
max = 1
chance = 0.15
[[treasure.loot]]
