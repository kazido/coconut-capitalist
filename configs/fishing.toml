# Crab pots: an AFK extra. Craft a pot, put it in a water you have opened, load it with bait and it catches rare fish
# (`min_rarity` and up) while you are away, one per interval, using one bait each, until it is full or out of bait. The
# fish wait for you to collect them. A basic pot earns very little next to fishing yourself; it takes the best bait, a
# top-level pot and the right pets to make it add up. They are also a way to get fish for your collection books.
# TODO(balance): all of it
