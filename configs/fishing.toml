# The community: one collection book for the whole server, and three goals every month that everyone works on together.
[community]
min_share = 0.05                  # to be paid for a monthly goal you must have done this share of it

[community.book]                  # donate these fish; when every page is full the whole server is paid and the book levels up
fish = ["marlin", "giant_squid", "oarfish", "abyssal_angler", "golden_koi"]   # 2 legendary, 2 premium, 1 mythical
max_level = 10
donor_bits_per_sell = 1.0         # a donated fish pays +100% of its sell price (these fish are rare: you give them up)
donor_xp_per_rarity = 40
completion_bits = 300000          # everyone eligible is paid this x the book's level when it is finished...
completion_xp = 1000              # ...plus this much xp x the level
[community.book.need_base]        # per fish at level 1, by rarity
5 = 3
6 = 2
7 = 1
[community.book.need_step]        # more per level after: need = base + floor((level - 1) x step)
5 = 2
6 = 1
7 = 0.5

[[community.monthly]]             # catch this many fish between you all this month
kind = "any"
count = 1500
bits = 150000
xp = 500
[[community.monthly]]
kind = "rarity"                   # fish of this rarity or better
rarity = 3
count = 150
bits = 250000
xp = 800
[[community.monthly]]
kind = "fish"                     # one specific fish (picked each month from this rarity)
rarity = 4
count = 15
bits = 400000
xp = 1200

# Record fish. Every catch has its own size (most are small, a few are giants). You keep your biggest of each fish,
# and the server keeps the biggest ever caught: beat them and you are paid.
[records]
personal_xp_per_rarity = 10       # a new personal best (or the first one of a fish) pays rarity x this xp
server_bits_multiplier = 2.0      # a new server record pays this x the fish's sell price in bits

# Bosses. Now and then (`odds`) what bites is not a fish but a boss: it bites like anything else, but once you pull up
# the line it takes a long reel (`length` arrows, with your rod's usual forgiveness). Win, and there is no fish to keep:
# you are paid a big pile of bits, xp and loot instead.  TODO(balance): all of it
