# Where scrolls come from. Every scroll now comes from ONE source: a mine type, a tree species or grain, a boss or water, or a crop (its anomaly).
# Aim: about one scroll per three hours of play in each skill, so a session or so; a scroll is an event, not routine. TODO(balance)

# Foraging: one species or grain each (foraging.toml `scroll = { item, odds }`). Fishing: one boss or water each (fishing.toml).
# Farming: one crop each (items.toml `[crop_x.crop] scroll`), plus Golden Sprout from anomaly harvests (farming.toml `anomaly_scroll`).
