# Where scrolls come from. Every skill has THREE scrolls of its own and shares THREE that fit any tool (Keenness, Scholar, Appraiser), and every skill's source
# hands out one of its six at random. Aim: about one scroll per WEEK of play (~15 active hours) in mining and foraging; a scroll is an event, not routine. TODO(balance)
# (Fishing has no entry: its scrolls come from treasure chests and boss loot, see fishing.toml.)

[mining]
odds = 10800                      # 1 in this many cells dug: about 720 cells an hour x ~15 active hours a week = about one scroll a week
pool = ["scroll_iron_frame", "scroll_veinfinder", "scroll_bounty", "scroll_keen", "scroll_scholar", "scroll_appraiser"]

[foraging]
odds = 675                        # 1 in this many private trees felled (about 45 trees an hour whatever your axe) x ~15 active hours a week = about one scroll a week
pool = ["scroll_sharp_eye", "scroll_seasoned", "scroll_double_strike", "scroll_keen", "scroll_scholar", "scroll_appraiser"]

[farming]
odds = 2000                       # 1 in this many growth cycles of what you harvest (a long crop is 100+ cycles). Nine plots watered every hour for a WEEK is ~1,500 cycles: under one scroll a week at the very most. TODO(balance)
pool = ["scroll_fertile", "scroll_seedkeeper", "scroll_gleaner", "scroll_keen", "scroll_scholar", "scroll_appraiser"]
