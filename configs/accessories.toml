# Accessories: small gear worn beside a skill's tool, 2 slots per skill (services/accessories.py). Their stats are added to the
# tool's stats in services/equipment.py, so every engine reads them unchanged. Plan: docs/plans/accessories.md.
# Everything here is balance data. TODO(balance) marks first guesses.

slots_per_skill = 2
# Chance that ONE skill action also drops a rolled accessory (a rarer one with traits). Most actions give nothing.
drop_chance = 0.005                       # TODO(balance)
# Traits a rolled accessory gets, by its rarity (index 0 = rarity 1).
traits_by_rarity = [0, 1, 1, 2, 2, 3, 3]  # TODO(balance)
# Trait value rule: a trait's `amount` is its value on a rarity-1 accessory. A rarer accessory multiplies it by
# rarity_mult[rarity - 1]. (Amounts are the level-1 values of the old stat enchants, in each stat's own unit.)
rarity_mult = [1.0, 1.2, 1.4, 1.6, 1.8, 2.0, 2.2]   # TODO(balance)

