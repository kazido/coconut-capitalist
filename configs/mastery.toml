# Mastery: a small tree per skill. You earn one point every `points_every_levels` skill levels and spend them on nodes. Each branch is a
# line of nodes (each needs the one before it and a skill level), and the branches are DIFFERENT ways to play, with trade-offs, so you
# cannot have everything (a full branch costs 9 points; level 100 earns 20). Nothing here touches xp. Respec costs bits.
# `effects` use the same stat names as tools and enchants (see services/equipment.py).  TODO(balance): all numbers

points_every_levels = 5
respec_bits = 100000

[[trees]]
skill = "mining"

