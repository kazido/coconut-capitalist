# Janitor: keeps the play channels free of the bot's old messages (see docs/plans/channel-cleanup.md).
# It only ever deletes messages the bot itself posted.
enabled = true

# Every text channel inside a category with one of these names is swept. This is the main way: it follows the real server, so a new
# or renamed play channel is picked up without editing ids.
category_names = ["gamble"]  # matches any category whose name CONTAINS this, e.g. "🎲︱21 gamble st."

# Extra channels swept by id (the old hard-coded six). Optional. Ids the bot cannot see are reported, not silently skipped.
channel_ids = []

# How often the sweep runs (it also runs once at startup).
interval_minutes = 5

# After a bot restart EVERY bot message in these channels is deleted (no menu survives a restart, so none can still be played).
# From then on, a bot message nobody has touched for this many minutes is swept. "Touched" means posted OR last edited, and a menu in
# use is edited on every click, so one being played is never swept. Drops and results count too: everything the bot posts here goes.
idle_minutes = 5

# The 5-minute sweeps only read messages posted in the last this-many hours (the startup pass and /cleanup read the WHOLE channel, once).
# Reading everything every 5 minutes made Discord rate limit us. Anything older that somehow survived goes at the next restart.
lookback_hours = 24

# Pause between deletes (messages older than 14 days cannot be bulk deleted, so they go one by one). Keeps clear of rate limits.
delete_delay_seconds = 0.6
