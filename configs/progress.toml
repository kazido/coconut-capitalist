# Coconut Level: one number for how far along you are. Every source below is a MILESTONE you reach once (a level, a rank, a
# collected pet, the Nth kill...). Nothing here pays for repeating something, so the level cannot be ground forever: when you have
# done everything, you are done. It is calculated from your current progress, so it needs no history and is the same for old players.
# TODO(balance): all numbers. `python -m scripts.balance` prints the maximum.

points_per_level = 60   # about 105 levels in all: finishing everything is the top tier

[skills]               # every level of every skill
per_level = 5          # for levels 2..after_level
after_level = 50
per_level_after = 10   # for every level above that, up to max_level
max_level = 100

[ranks]
per_rank = 25

[pets]
per_pet = 10           # every different pet you own
per_extra_star = 5     # every star above the first
maxed_level = 25       # a pet at the top level

[farming]
per_plot = 20          # every plot above the free one

[tools]
per_level = 15         # every tool level above the first, for the best tool you own of each kind (axe, pickaxe, rod, sword)

[bestiary]             # per enemy: reaching each number of kills pays `points` (a boss pays boss_points). The kill count itself never stops climbing.
steps = [1, 25, 100, 500, 2500, 10000]
points = 5
boss_steps = [1, 5, 25, 100, 500]
boss_points = 50
fish_steps = [1, 25, 100, 500, 2500]   # every fish species you can catch; fishing bosses use boss_steps
fish_points = 3
sea_boss_points = 15

# Counters. Each step reached pays `points` once. `stat` is read from your skills (see services/progress.py STATS).
