# Foraging rules (see the wiki). Balance data: change numbers freely.  # TODO(balance): all numbers are guesses
#
# Chop a private tree any time, or join the community tree that grows every hour. A tree has hit points; every chop
# takes off your axe's power. Zones 1..`zones` make trees bigger; a zone needs foraging level
# 1 + (zone - 1) x levels_per_zone.

zones = 10
levels_per_zone = 2               # zone 7 needs level 13
heavy_zone = 7                    # private trees from this zone up are "heavy"...
heavy_solo_power = 0.5            # ...and a lone chopper hits at this share of their power (the Soloist enchant removes it)
zone_hp_growth = 0.75             # a tree's hp = its height x (1 + this x (zone - 1))
xp_per_hp = 3                     # foraging xp = hp chopped x this
bits_per_hp = 155                 # bits = hp chopped x this (x the zone bonus). A master chopper (who knows the patterns) lands about 30% more hp per click, so this pays them a bit under mining per click
hp_per_roll = 220                 # a felled tree makes ceil(hp / this) rolls on the foraging drop tables
zone_reward_growth = 0.15         # each zone above 1 pays +15% per hp (zone 7: x1.9, zone 10: x2.35)

[[heights]]                       # a private tree's height (before the zone scaling), by weight
min = 20
max = 40
weight = 0.499
[[heights]]
min = 40
max = 50
weight = 0.300
[[heights]]
min = 50
max = 60
weight = 0.200
[[heights]]
min = 90
max = 100
weight = 0.001

[chopping]                        # a swing is your axe's power x the spot's grain x how worn it is x your stance's combo
good_chop_chance = 0.15           # a "good chop" does extra damage
good_chop_bonus = 0.5             # +50%
wear_chance = 0.2                 # every chop has this chance to wear the spot down one step (so it is random, not every click)
wear_step = 0.15                  # each step makes chops 15% weaker...
spot_floor = 0.4                  # ...down to 40%. Rotating (a click that does no damage) moves you to a random new spot.

# Every spot has a grain, and every grain has its own secret PATTERN of three stances: o = overhead, s = sidecut, u = undercut.
# Do the right stance for the step you are on and the grain gives: the step advances, a combo builds (+10% per correct move in a
# row) and the last step of the pattern lands a finisher. The wrong stance is only a glancing blow and you stay on the same step.
# You learn a pattern as you go: every step you get right is remembered for good, so later you just follow it. Deeper trees
# make you do more steps of the pattern (the first steps are always the same), see cycle_by_zone.
combo_step = 0.10                 # each correct move in a row adds 10% damage
finisher = 1.5                    # finishing the pattern lands x1.5
glancing = 0.3                    # a wrong stance does only this much
cycle_by_zone = [3, 3, 4, 4, 5, 5, 6, 6, 7, 8]   # how many steps of the pattern a tree of this zone (1, 2, ...) makes you do

[[chopping.grains]]               # rotating lands you on one of these (by weight): is the new spot better than the one you have?
id = "plain"
name = "Plain"
multiplier = 1.0
weight = 0.30
