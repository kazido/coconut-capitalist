# Foraging rules (see the wiki). Balance data: change numbers freely.  # TODO(balance): all numbers are guesses
#
# Chop a private tree any time, or join the community tree that grows every hour. A tree has hit points; every chop
# takes off your axe's power. Zones 1..`zones` make trees bigger; zone N needs foraging level zone_levels[N - 1].
# The gaps between levels grow (3, 3, 4, 4, 5, ...) so each zone takes a little longer than the one before. (The level
# curve is quadratic: level 20 is about 74k xp, level 50 about 490k, level 100 about 2M.)

zones = 20
zone_levels = [1, 4, 7, 11, 15, 20, 25, 31, 37, 44, 51, 59, 67, 76, 85, 94, 104, 114, 125, 136]
heavy_zone = 8                    # private trees from this zone up are "heavy"...
heavy_solo_power = 0.5            # ...and a lone chopper hits at this share of their power (the Soloist enchant removes it)
zone_hp_growth = 0.75             # a tree's hp = its height x (1 + this x (zone - 1))
xp_per_hp = 3                     # foraging xp = hp chopped x this
bits_per_hp = 200                 # bits = hp chopped x this (x the zone bonus). Tuned to pay a bit under mining per click
hp_per_roll = 170                 # a felled tree makes ceil(hp / this) rolls on the foraging drop tables
zone_reward_growth = 0.07         # each zone above 1 pays +7% per hp (zone 10: x1.63, zone 20: x2.33). Kept small so the deep zones do not run away from the other skills

[[heights]]                       # a private tree's height (before the zone scaling), by weight
min = 20
max = 40
weight = 0.499
[[heights]]
min = 40
max = 50
weight = 0.300
[[heights]]
min = 50
max = 60
weight = 0.200
[[heights]]
min = 90
max = 100
weight = 0.001

[chopping]                        # a swing is your axe's power x the spot's grain (x a good chop's bonus)
good_chop_chance = 0.15           # a "good chop" does extra damage
good_chop_bonus = 0.5             # +50%

# Every spot has a grain, and every grain has its own secret PATTERN of three stances: o = overhead, s = sidecut, u = undercut.
# For each step you pick a stance. A wrong one puts an X on the step and you move on to the next (the swing still chops: it only
# matters for learning); the right one is remembered for good, and a wrong one is crossed off in your notes, so you piece each
# grain together from your guesses. Do every step right on one spot and you earn a little extra xp. When the pattern is done you
# move to a new spot (a new grain) by yourself. Deeper trees make you do more steps (the first steps are always the same).
perfect_xp_per_step = 10          # a spot done with every step right pays this much foraging xp per step
cycle_by_zone = [3, 3, 3, 4, 4, 4, 5, 5, 6, 6, 6, 7, 7, 7, 8, 8, 8, 8, 8, 8]   # how many steps of the pattern a tree of this zone (1, 2, ...) makes you do

[[chopping.grains]]               # rotating lands you on one of these (by weight): is the new spot better than the one you have?
id = "plain"
name = "Plain"
multiplier = 1.0
weight = 0.30
pattern = "sussuuoo"
[[chopping.grains]]
id = "knotty"
name = "Knotty"
multiplier = 0.7
weight = 0.20
pattern = "usuuooss"
[[chopping.grains]]
id = "clean"
name = "Clean grain"
multiplier = 1.3
weight = 0.15
pattern = "suoussou"
[[chopping.grains]]
id = "twisted"
name = "Twisted"
multiplier = 0.9
weight = 0.15
pattern = "soouosos"
[[chopping.grains]]
id = "split"
name = "Split"
multiplier = 1.1
weight = 0.10
pattern = "oussosso"
[[chopping.grains]]
id = "burl"
name = "Burl"
multiplier = 1.4
weight = 0.10
pattern = "ouosusos"

[community]                       # the tree everyone can join: one per hour, standing for `open_minutes`
open_minutes = 30
default_zone = 3                  # its zone when nobody has chopped lately
zone_below = 2                    # its zone is picked from (the zone the typical recent chopper can reach) - this...
zone_above = 1                    # ...to + this, the same for everybody that hour
hp_per_active = 5                 # community hp = a typical tree's hp in that zone x this x the number of recent choppers
min_active = 3                    # (counted as at least 3, so a quiet server still gets a proper tree...
max_active = 40                   # ...and at most 40, so a huge crowd does not get an endless one)
recent_windows = 24               # "recent" = people who chopped a community tree in the last 24 hours
min_share = 0.05                  # you need at least this share of the tree's hp to be paid in drops and bits
group_bonus = 0.05                # +5% drops and bits for everybody per extra qualifying chopper...
max_group_bonus = 0.5             # ...up to +50%
expired_factor = 0.25             # a tree nobody finished pays this share of what felling it would have
refresh_seconds = 5               # how often the open panel refreshes itself

[party_tree]                      # a tree only your party can chop: start one from the Foraging page
open_minutes = 20
hp_per_member = 4                 # hp = a typical tree of its zone x 4 x the party's size (a party of 4: x16)
min_share = 0.10                  # you need at least this share of the tree to be paid in drops and bits
group_bonus = 0.10                # +10% per extra member who did their share (the community tree gives +5%)...
max_group_bonus = 0.5             # ...up to +50%
expired_factor = 0.25
refresh_seconds = 5

[releaf]                          # donate a tree's drops to the Re-leaf foundation (the wiki)
min_level = 10                    # foraging level
daily_limit = 3                   # donations per UTC day
meter_per_rarity = 5              # a donation fills the meter by (the rarest item donated's rarity) x this: a rarity 5 item = 25
meter_goal = 50                   # when the meter is full, your NEXT tree is a double tree
double_hp = 2.0                   # a double tree has this many times the hp...
double_bits = 1000000             # ...and pays this many bits (the wiki says 10,000,000: scaled down to this economy)  TODO(balance)
double_spirit_chance = 0.01       # ...or, 1 time in 100, a Spirit of the Forest instead
spirit_item = "spirit_of_the_forest"
growth_donations = 420            # donations needed to unlock growth mode (not built yet)
