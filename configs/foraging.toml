# Foraging rules (see the wiki). Balance data: change numbers freely.  # TODO(balance): all numbers are guesses
#
# Chop a private tree any time, or join the community tree that grows every hour. A tree has hit points; every chop
# takes off your axe's power. Zones 1..`zones` make trees bigger; zone N needs foraging level zone_levels[N - 1].
# The gaps between levels grow (3, 3, 4, 4, 5, ...) so each zone takes a little longer than the one before. (The level
# curve is quadratic: level 20 is about 74k xp, level 50 about 490k, level 100 about 2M.)

zones = 20
zone_levels = [1, 4, 7, 11, 15, 20, 25, 31, 37, 44, 51, 59, 67, 76, 85, 94, 104, 114, 125, 136]
heavy_zone = 8                    # private trees from this zone up are "heavy"...
heavy_solo_power = 0.5            # ...and a lone chopper hits at this share of their power (the Soloist enchant removes it)
zone_hp_growth = 0.75             # a tree's hp = its height x (1 + this x (zone - 1))
xp_per_swing = 10                  # foraging xp = this x the quality of every chop (grain and good chops, never the axe). A normal chop is about 1.
bits_per_hp = 0                   # no bits for chopping itself: foraging pays through what the tree drops (sell it) and xp. (Was 60.)
hp_per_roll = 70                  # a felled tree makes ceil(hp / this) rolls on the foraging drop tables (was 170: upgrade materials came too slowly)
zone_reward_growth = 0.07         # each zone above 1 pays +7% per hp (zone 10: x1.63, zone 20: x2.33). Kept small so the deep zones do not run away from the other skills

[[heights]]                       # a private tree's height (before the zone scaling), by weight
min = 20
max = 40
weight = 0.499
[[heights]]
min = 40
max = 50
weight = 0.300
[[heights]]
min = 50
max = 60
weight = 0.200
[[heights]]
min = 90
max = 100
weight = 0.001

[chopping]                        # a swing is your axe's power x the spot's grain x the spot's wear (x a good chop's bonus)
good_chop_chance = 0.15           # a "good chop" does extra damage
good_chop_bonus = 0.5             # +50%
wrong_stance_factor = 0.5         # the wrong style chops at half the damage (and half the xp): learn the grain's style once and it is yours
wear_per_chop = 0.1              # a spot of wear 1 lasts 25 chops (then you move to a new spot by yourself)
wear_penalty = 0.4                # as a spot wears out it chops weaker: at the very end it is at 60%
special_chance = 0.08             # the chance a new spot is a SPECIAL one (see [[chopping.specials]])
streak_bonus = 0.05               # every GRAIN you finish with every chop in its right style adds this much damage to your next chops on the same tree...
streak_max = 3                    # ...up to this many grains (+15%). One wrong-style chop on a grain (or a new tree) starts it over. A private tree only has a grain or two, so it is worth
                                  # up to +5-10% there; shared trees go on long enough to hit the cap. Damage only: no extra xp. The same cap on private, party and community trees
mark_cap = 0.5                    # marks can put at most +50% on one tree's rewards

# Every spot has a grain, and every grain likes ONE chop style: o = overhead, s = sidecut, u = undercut. Chop in that style for the
# full effect; any other is a glancing blow. Your Grain notes remember what you find out, so you learn each grain once and know it
# for good. Chopping wears the spot out, and the good grains wear slowest (the bad ones go quickly), so a clean spot is worth
# staying on. When a spot is worn out you move to a new one (a random grain) by yourself. Do not like the grain you got? Spend a
# rotation wedge (see [rotate]) to move on at once.
[[chopping.grains]]
id = "plain"
name = "Plain"
multiplier = 1.0
weight = 0.30
stance = "s"
wear = 1.0
[[chopping.grains]]
id = "knotty"
name = "Knotty"
multiplier = 0.7
weight = 0.20
stance = "u"
wear = 1.6
[[chopping.grains]]
id = "clean"
name = "Clean"
multiplier = 1.3
weight = 0.15
stance = "o"
wear = 0.7
[[chopping.grains]]
id = "twisted"
name = "Twisted"
multiplier = 0.9
weight = 0.15
stance = "s"
wear = 1.3
[[chopping.grains]]
id = "split"
name = "Split"
multiplier = 1.1
weight = 0.10
stance = "o"
wear = 0.9
[[chopping.grains]]
id = "burl"
name = "Burl"
multiplier = 1.4
weight = 0.10
stance = "u"
wear = 0.6

# Special spots: rare. Chop one in its grain's RIGHT style and it does something big (a wrong style is just a glancing blow). They wear out
# fast, so you get a few good chops. The spot shows its name, so you know to get the style right.  TODO(balance): all numbers
[[chopping.specials]]
id = "heartwood"
name = "Heartwood"
emoji = "💎"
effect = "damage"                 # a right chop does this many times the damage to the tree
amount = 4.0
weight = 0.40
wear = 6.0
[[chopping.specials]]
id = "golden_knot"
name = "Golden Knot"
emoji = "✨"
effect = "xp"                     # a right chop pays this many times the xp
amount = 2.0
weight = 0.35
wear = 6.0
[[chopping.specials]]
id = "rich_seam"
name = "Rich Seam"
emoji = "🏷️"
effect = "mark"                   # a right chop marks your tree: +15% drops when it falls (up to mark_cap)
amount = 0.15
weight = 0.25
wear = 6.0
private_only = true

# Rotation wedges: consumables (the Iron and Gilded wedges are crafted at the Workbench, see recipes.toml) that move you off the spot you are on. A better wedge tilts the new grain toward
# the good ones (its chance is the grain's weight x its multiplier ** bias) and makes a special spot likelier (special_mult x the chance).
# You can craft them (or buy the plain one) or find them chopping (they are on the foraging drop table).
[rotate]
[[rotate.wedges]]
item = "rotation_wedge"
bias = 0
special_mult = 1.5
[[rotate.wedges]]
item = "iron_wedge"
bias = 4
special_mult = 4
boost = 0.2
boost_chops = 40
[[rotate.wedges]]
item = "gilded_wedge"
bias = 12
special_mult = 10
boost = 0.5
boost_chops = 120

[community]                       # the tree everyone can join: one per hour, standing for `open_minutes`
open_minutes = 30
default_zone = 3                  # its zone when nobody has chopped lately
zone_below = 2                    # its zone is picked from (the zone the typical recent chopper can reach) - this...
zone_above = 1                    # ...to + this, the same for everybody that hour
hp_per_active = 5                 # community hp = a typical tree's hp in that zone x this x the number of recent choppers
min_active = 3                    # (counted as at least 3, so a quiet server still gets a proper tree...
max_active = 40                   # ...and at most 40, so a huge crowd does not get an endless one)
recent_windows = 24               # "recent" = people who chopped a community tree in the last 24 hours
min_share = 0.05                  # you need at least this share of the tree's hp to be paid in drops and bits
group_bonus = 0.02                # +2% drops and bits for everybody per extra qualifying chopper (the pool below does the rest; was 5%)...
max_group_bonus = 0.2             # ...up to +20% (was 50%)
max_share = 1.0                   # you are paid for at most this share of the tree (1 = no cap; the pool below is what keeps a lone chopper in line)
pool_base = 0.5                   # the share of the tree's worth that is paid out when ONE chopper did their share (a lone chopper gets half, as the old 50% cap did)...  TODO(balance)
pool_per_chopper = 0.2            # ...the second chopper adds this...
pool_decay = 0.6                  # ...and each further one adds 0.6 x what the one before added, so the pool climbs toward 1.0 (1: 0.50, 2: 0.70, 3: 0.82, 5: 0.93, 10: 0.99) and no further
expired_factor = 0.25             # a tree nobody finished pays this share of what felling it would have
refresh_seconds = 5               # how often the open panel refreshes itself

[party_tree]                      # a tree only your party can chop: start one from the Foraging page
open_minutes = 20
hp_per_member = 4                 # hp = a typical tree of its zone x 4 x the party's size (a party of 4: x16)
min_share = 0.10                  # you need at least this share of the tree to be paid in drops and bits
group_bonus = 0.10                # +10% per extra member who did their share (the community tree gives +5%)...
max_group_bonus = 0.5             # ...up to +50%
expired_factor = 0.25
refresh_seconds = 5

[releaf]                          # the Releaf Foundation: the whole server gives rare drops to ONE shared meter; a full meter starts a temporary server-wide Bloom
min_level = 10                    # foraging level to give
min_rarity = 4                    # only items of this rarity or more can be given: it is a real loss, the item is gone
points = { 4 = 1, 5 = 3, 6 = 8, 7 = 20 }   # meter points one item is worth, by rarity (cheap rarity-4 food is worth little, a rare feather a lot)  TODO(balance)
meter_goal = 300                  # points that fill the meter and start a Bloom (about 7 hours of a normal server giving, see DESIGN.md)  TODO(balance)
max_share = 0.25                  # one player can give at most this share of the goal per cycle: at least 4 people are needed
bloom_hours = 3                   # a Bloom lasts this long, then the meter is empty and giving reopens
bloom_xp = 0.10                   # during a Bloom everyone's foraging xp is +10%...  TODO(balance)
bloom_drops = 0.10                # ...and every drop chance of a foraging tree is +10% (private, community and party trees alike)  TODO(balance)
top_donors = 5                    # names shown on the donor list

