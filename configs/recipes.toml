# The Workbench (screens/craft.py, services/crafting.py): things you MAKE from materials instead of buying them.
# Each recipe uses up `inputs` (item = how many) and `bits` (a small workbench fee) and makes `quantity` of `output`.
# `skill` + `min_level` (optional) ask for a level first. Outputs are plain stackable items (never tools).
# Sell All keeps the inputs of every recipe while "Keep upgrade materials" is on (screens/sellall.py).
# Balance: each used to be a shop item; the inputs' sell value sits a little under the old shop price, but how fast you find them matters
# more (see DESIGN.md "Crafting").  TODO(balance): all numbers

[radar_battery]
name = "Radar Battery"
emoji = "🔋"
output = "radar_battery"
quantity = 1
# Was 3,000 bits in the shop. Coral shards wash up on 1 cast in 6 (about 26 an hour of fishing), plant fiber is a farming leftover, so this is
# about 13 batteries per hour of fishing: well under the old price in sell value on purpose (a cast needs a battery, shards are slow).
inputs = { coral_shard = 2, plant_fiber = 2 }

[iron_wedge]
name = "Iron Wedge"
emoji = "🪚"
output = "iron_wedge"
quantity = 1
bits = 500
# Hardwood (a forest drop) plus common ores. TODO(balance): guessed amounts, check with scripts.balance.
inputs = { hardwood = 1, iron_ore = 10, copper_ore = 20 }

[gilded_wedge]
name = "Gilded Wedge"
emoji = "🪚"
output = "gilded_wedge"
quantity = 1
bits = 2500
skill = "foraging"
min_level = 7                      # forest 3
# More hardwood and the higher ores (gold, platinum). TODO(balance): guessed amounts, check with scripts.balance.
inputs = { hardwood = 3, gold_ore = 15, platinum_ore = 5 }

