# Combat enemies. skills are in priority order (the first one off cooldown is used); shield absorbs damage before hp.
# TODO(balance): every number here. Speed 100 is a normal player. xp is combat xp for the kill. Aim: an hour of farming the
# lowest fights pays about what the other skills pay with starter gear (~7,000 xp); see `python -m scripts.balance`.
[zombie]
name = "Zombie"
emoji = "🧟"
attack = 12
hp = 90
speed = 90
skills = ["strike"]
xp = 56
drops = "graveyard"
drop_chance = 60

[armored_zombie]
name = "Armored Zombie"
emoji = "🧟"
attack = 12
hp = 90
shield = 60
defense = 25
speed = 85
skills = ["armor_slam", "strike"]
xp = 92
drops = "graveyard"
drop_chance = 75

[skeleton]
name = "Skeleton"
emoji = "💀"
attack = 22
hp = 45
speed = 115
skills = ["rattle", "strike"]
xp = 72
drops = "graveyard"
drop_chance = 65

# --- the final boss of the graveyard. Stun-immune; it always shows what it will do next (telegraph), so Death Knell can be
# planned for (Brace, slows, killing it faster). Below 60% hp and again below 30% it changes. TODO(balance).
[gravewarden]
name = "The Gravewarden"
emoji = "👑"
attack = 26
hp = 700
defense = 30
speed = 95  # just slower than a fresh player: you always get to see the first Death Knell coming
skills = ["death_knell", "soul_drain", "bone_strike"]
immune = ["stun"]
boss = true
telegraph = true
drops = "gravewarden"
drop_chance = 100
xp = 8000  # about one whole level at combat level 20 (7,959). Keys keep it rare, so it can be a big prize

    [[gravewarden.phases]]
    below = 0.6
    message = "The Gravewarden's eyes ignite. The cold deepens!"
    skills = ["death_knell", "grave_chill", "soul_drain", "bone_strike"]
    buffs = [{ kind = "attack_up", turns = 99, value = 0.3 }]

    [[gravewarden.phases]]
    below = 0.3
    message = "The Gravewarden roars, and the crypt shakes: it is enraged!"
    buffs = [{ kind = "attack_up", turns = 99, value = 0.6 }, { kind = "speed_up", turns = 99, value = 0.25 }]

