# Mining rules (see the wiki). Everything here is balance data: change numbers freely.
# depth_tables: one list of item ids per depth TIER (a tier spans [descent].rows_per_tier rows; the last tier
# continues forever). For each cell the items are rolled in order and the first one that drops wins, so every
# list MUST be rarest-first (validated at startup).

columns = 5
xp_per_column = 10                 # xp for every column dug (kept even if the mine collapses)

depth_tables = [
  ["amber", "clay", "coal", "copper_ore"],
  ["amber", "clay", "iron_ore", "tin_ore", "coal", "copper_ore"],
  ["dusty_dandelion_seed", "amber", "silver_ore", "obsidian", "gold_ore", "clay", "iron_ore", "tin_ore", "coal", "copper_ore"],
  ["sanity_gemstone", "rage_gemstone", "peace_gemstone", "balance_gemstone", "dusty_dandelion_seed", "garnet", "amber", "platinum_ore", "silver_ore", "obsidian", "gold_ore", "clay", "iron_ore", "tin_ore", "coal", "copper_ore"],
  ["sanity_gemstone", "rage_gemstone", "peace_gemstone", "balance_gemstone", "spirit_of_the_mines", "emerald", "sapphire", "dusty_dandelion_seed", "garnet", "amber", "platinum_ore", "silver_ore", "obsidian", "gold_ore", "clay", "iron_ore", "tin_ore", "coal", "copper_ore"],
]

[wyrmhole]
odds = 25000                       # 1-in-N per cell below `min_row`
gem_bonus = 5000                   # N shrinks by this for every gem placed in the reactor
min_odds = 1000                    # ...but never below this
min_depth = 2                      # first row (0-based) wyrmholes can hide in
implosion_item = "implosion_gemstone"
[wyrmhole.pool]                    # item = quantity found in a wyrmhole cell
scarab_bomb = 20
copper_ore = 1000
iron_ore = 300
gold_ore = 100

[reactor]
gem_slot_level = 10                # mining level needed to place gems
max_prestige = 25
prestige_per_extra_column = 5      # +1 column dug every this many reactor levels
core_gems = ["sanity_gemstone", "rage_gemstone", "peace_gemstone", "balance_gemstone"]
automine_seconds = 360             # one lode per level every 6 minutes
automine_cap_hours = 24            # lodes stop piling up after this long

[magnet]
level = 5                          # mining level needed
capacity = 1000                    # TODO(balance): not in the wiki
[magnet.values]                    # TODO(balance): meter points per deposited ore
copper_ore = 1
iron_ore = 10
gold_ore = 100

[scarab]                           # a subterranean scarab can turn up after ANY mine (a safe exit, the vault, a collapse or a wyrmhole), holding a scrambled scroll
chance = 12                        # 1 in 12 mines (it was 1 in 51, and only after a safe exit)
seconds = 45                       # time to unscramble the scroll (it was 30)

# What it gives for the right word: one prize, by weight.  TODO(balance)
[[scarab.prizes]]
name = "Bombs"
weight = 35
items = { scarab_bomb = 3 }
[[scarab.prizes]]
name = "A lesson in the rock"
weight = 35
xp = 1500                          # about 13 minutes of mining xp
[[scarab.prizes]]
name = "A scarab's hoard"
weight = 20
items = { copper_ore = 120, iron_ore = 35, gold_ore = 8 }   # about a sixth of a vault's ore
xp = 400
[[scarab.prizes]]
name = "A glittering find"
weight = 10
items = { sapphire = 1, emerald = 1 }
xp = 800

# ---- The descent: a shaft of `floor` rows. Plain cells show their ore; richer ore is harder to dig and adds
# more pressure; pressure sets the collapse risk (always shown). Reach the floor to open the vault.  # TODO(balance): all numbers
[descent]
floor = 30                         # rows in the shaft; the vault waits below the last one
rows_per_tier = 6                  # tier = row // rows_per_tier: rows 0-5 use tier 0 ... rows 24-29 use tier 4

creak = 2.0                        # pressure every dig adds before the ore's own hardness
default_hardness = 6
empty_hardness = 2                 # digging an empty cell
reactor_reduction = 0.02           # each reactor level above 1 slows pressure gains by 2%...
max_reduction = 0.5                # ...up to 50%
brace_amount = 15                  # pressure removed by one brace (a brace skips the dig)
braces_base = 1
braces_per_reactor_levels = 5      # +1 brace for every 5 reactor levels

safe_pressure = 20                 # no collapse risk below this
max_risk = 0.40                    # collapse chance per dig at 100 pressure
risk_exponent = 2.0                # how sharply risk climbs between safe and 100
collapse_loss = 0.5                # share of the unbanked haul lost when the mine collapses
power_base = 3                     # a Rookie Pickaxe (power 3) digs plain ore. Every tool starts at power 3
power_yield_bonus = 0.25           # +25% quantity per point of pickaxe power above that (power 9: x2.5, power 71: x18)
depth_bonus_per_row = 0.05         # every row deeper pays +5% more (row 29 pays x2.45)

# Special cells
vent_chance = 0.15                 # per cell, from row 1: no loot, but it bleeds pressure
vent_relief = 12
rich_chance = 0.15                 # per cell: a mystery lode that rolls the next tier's table...
rich_multiplier = 2.0              # ...and gives this much more of it
cache_chance = 0.06                # per cell: supplies
cache_min_depth = 2
cache_braces = 1                   # +1 brace
bomb_pressure = 8                  # a bomb clears a whole row for this flat pressure
bombs_per_run = 3                  # most bombs you can carry down
soft_below = 5                     # from above, a cell's rock feels SOFT (hardness under 5: copper, nothing, vents, caches), FIRM (5 to 8: iron) or HARD (9 and up: gold).
hard_from = 9                      # Hard rock takes more pressure to dig and is where the better ore is: that is the choice of column.
lookahead = 3                      # rows ahead you can see (only rich lodes and wyrmholes show; the rest is hidden)
vault_gem_chance = 0.03            # a reactor gem is rare: only this chance of one in the vault...
[descent.vault_ore]                # ...but these ores are always there: all three, in the proportion you would mine them (the rarer, the fewer).
copper_ore = 330                   # Worth about 94,000 bits at the doubled ore prices, but it is the ORE COUNT that matters for upgrades (it was 1100 / 300 / 100). The pickaxe upgrade to Masterwork
iron_ore = 90                      # asks for 400 copper, 300 iron and 60 gold: one vault covers about a third of the iron, so it takes a few visits
gold_ore = 30

# Landmark rows: finish row 10 or 20 and you reach a CHECKPOINT: what is in your pack is safe from a collapse from then on (a collapse only
# takes a share of what you dug after it). So you can push on knowing what you already have is kept. (relief / braces / vault_share can add a
# little extra but each of those makes the vault easier to reach and the mine pay much more, so they are off.) Row 30 is the vault.
[[descent.milestones]]
row = 10
[[descent.milestones]]
row = 20

[descent.hardness]                 # pressure added when this item is dug (empty cells use empty_hardness)
copper_ore = 4
iron_ore = 6
gold_ore = 10
dusty_dandelion_seed = 8
sanity_gemstone = 16
rage_gemstone = 16
peace_gemstone = 16
balance_gemstone = 16
spirit_of_the_mines = 20
coal = 3
clay = 3
amber = 4
tin_ore = 5
silver_ore = 7
garnet = 8
obsidian = 9
platinum_ore = 11
sapphire = 13
emerald = 14

