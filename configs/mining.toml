# ---- The descent: a shaft of `floor` rows. Plain cells show their ore; richer ore is harder to dig and adds
# more pressure; pressure sets the collapse risk (always shown). Reach the floor to open the vault.  # TODO(balance): all numbers
[descent]
floor = 30                         # rows in the shaft; the vault waits below the last one
rows_per_tier = 6                  # tier = row // rows_per_tier: rows 0-5 use tier 0 ... rows 24-29 use tier 4

creak = 2.0                        # pressure every dig adds before the ore's own hardness
default_hardness = 6
empty_hardness = 2                 # digging an empty cell
lifeline_pressure = 30             # Mastery capstone Lifeline: when it saves you the reactor drops the mine to this much pressure...
lifeline_loss = 0.25               # ...it costs this share of what you carry (a collapse takes collapse_loss)...
lifeline_runs = 8                  # ...and it needs this many mines to recharge (the one it saved counts as the first)
reactor_reduction = 0.02           # each reactor level above 1 slows pressure gains by 2%...
max_reduction = 0.5                # ...up to 50%
brace_amount = 25                  # pressure removed by one brace (a brace skips the dig)
braces_base = 1
braces_per_reactor_levels = 5      # +1 brace for every 5 reactor levels

safe_pressure = 20                 # no collapse risk below this
max_risk = 0.40                    # collapse chance per dig at 100 pressure
risk_exponent = 2.0                # how sharply risk climbs between safe and 100
collapse_loss = 0.5                # share of the unbanked haul lost when the mine collapses
power_base = 3                     # a Rookie Pickaxe (power 3) digs plain ore. Every tool starts at power 3
power_yield_bonus = 0.25           # +25% quantity per point of pickaxe power above that (power 9: x2.5, power 71: x18)
depth_bonus_per_row = 0.05         # every row deeper pays +5% more (row 29 pays x2.45)

# Special cells
vent_chance = 0.15                 # per cell, from row 1: no loot, but it bleeds pressure
vent_relief = 12
rich_chance = 0.15                 # per cell: a mystery lode that rolls the next tier's table...
rich_multiplier = 2.0              # ...and gives this much more of it
cache_chance = 0.06                # per cell: supplies
cache_min_depth = 2
cache_braces = 1                   # +1 brace
bomb_pressure = 8                  # a bomb clears a whole row for this flat pressure
bombs_per_run = 3                  # most bombs you can carry down
soft_below = 5                     # from above, a cell's rock feels SOFT (hardness under 5: copper, nothing, vents, caches), FIRM (5 to 8: iron) or HARD (9 and up: gold).
hard_from = 9                      # Hard rock takes more pressure to dig and is where the better ore is: that is the choice of column.
lookahead = 3                      # rows ahead you can see (only rich lodes and wyrmholes show; the rest is hidden)
vault_gem_chance = 0.03            # a reactor gem is rare: only this chance of one in the vault...
[descent.vault_ore]                # ...but these ores are always there: all three, in the proportion you would mine them (the rarer, the fewer).
material_copper_ore = 330                   # Worth about 94,000 bits at the doubled ore prices, but it is the ORE COUNT that matters for upgrades (it was 1100 / 300 / 100). The pickaxe upgrade to Masterwork
material_iron_ore = 90                      # asks for 400 copper, 300 iron and 60 gold: one vault covers about a third of the iron, so it takes a few visits
material_gold_ore = 30

# Landmark rows: finish row 10 or 20 and you reach a CHECKPOINT: what is in your pack is safe from a collapse from then on (a collapse only
# takes a share of what you dug after it). So you can push on knowing what you already have is kept. (relief / braces / vault_share can add a
# little extra but each of those makes the vault easier to reach and the mine pay much more, so they are off.) Row 30 is the vault.
[[descent.milestones]]
row = 10
[[descent.milestones]]
row = 20

[descent.hardness]                 # pressure added when this item is dug (empty cells use empty_hardness)
