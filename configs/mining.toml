# Mining rules (see the wiki). Everything here is balance data: change numbers freely.
# depth_tables: one list of item ids per depth TIER (a tier spans [descent].rows_per_tier rows; the last tier
# continues forever). For each cell the items are rolled in order and the first one that drops wins, so every
# list MUST be rarest-first (validated at startup).

columns = 5
xp_per_column = 10                 # xp for every column dug (kept even if the mine collapses)

depth_tables = [
  ["material_amber", "material_clay", "material_coal", "material_copper_ore"],
  ["material_amber", "material_clay", "material_iron_ore", "material_tin_ore", "material_coal", "material_copper_ore"],
  ["seed_dusty_dandelion", "material_amber", "material_silver_ore", "material_obsidian", "material_gold_ore", "material_clay", "material_iron_ore", "material_tin_ore", "material_coal", "material_copper_ore"],
  ["key_gemstone_sanity", "key_gemstone_rage", "key_gemstone_peace", "key_gemstone_balance", "seed_dusty_dandelion", "material_garnet", "material_amber", "material_platinum_ore", "material_silver_ore", "material_obsidian", "material_gold_ore", "material_clay", "material_iron_ore", "material_tin_ore", "material_coal", "material_copper_ore"],
  ["key_gemstone_sanity", "key_gemstone_rage", "key_gemstone_peace", "key_gemstone_balance", "spirit_of_the_mines", "material_emerald", "material_sapphire", "seed_dusty_dandelion", "material_garnet", "material_amber", "material_platinum_ore", "material_silver_ore", "material_obsidian", "material_gold_ore", "material_clay", "material_iron_ore", "material_tin_ore", "material_coal", "material_copper_ore"],
]

# ---- The 14 mines (names and emoji: configs/locations.toml, same order). A mine digs through its own 5 depth tables (leave `tables` out to use the
# shared `depth_tables` above, as mine 1 does), and scales what every cell pays (yield_mult) and the pressure every dig adds (hardness_mult).
# Every mine's deepest tables hold all four reactor gems (a test checks it). Deeper mines start further up the ore ladder: mine k's tier t table is the
# shared table min(t + shift, 4) with shift = (k - 1) * 4 // 13 (0 for mines 1-4 ... 4 for mine 14).  yield_mult is fitted (scratch sim, bits per click) so income climbs +7% per mine (mine 14 = x1.9 of mine 1); hardness_mult stays 1.0 because harder rock only shortens runs.  TODO(balance)

[[mines]]
id = "slimy_burrow"


