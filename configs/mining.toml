# ---- Mine types: every time you head down the game rolls one by weight and shows it before you dig. Standard is the plain mine (no effects).
# Weights are relative (they add up to 100 here, so a weight is a percent). Effects: pressure_mult (x pressure per dig), xp_mult (x the run's xp),
# yield_mult (x the quantity of every cell), rich_chance_add (added to the chance a cell is a rich lode), ore_boost (item = x its drop chance; the
# other ores stay possible, but a harder ore also adds pressure so keep it mild), ore_yield (item = x the quantity of that item, the vault's too). Numbers are simulated in DESIGN.md "Mine types": each ore type is worth ~+10-25% of its ore, each effect type ~+8-15%.  TODO(balance)
[[mine_types]]
id = "standard"
name = "Standard"
emoji = "⛏️"
weight = 74
description = "A plain shaft."

[[mine_types]]
id = "copper_seam"
name = "Copper Seam"
emoji = "🟤"
weight = 6
description = "Copper comes out in fatter heaps (+20%), the vault's too."
ore_yield = { material_copper_ore = 1.2 }

[[mine_types]]
id = "iron_vein"
name = "Iron Vein"
emoji = "🔩"
weight = 6
description = "Iron shows more often and in bigger lumps (+15%), the vault's too."
ore_boost = { material_iron_ore = 1.1 }
ore_yield = { material_iron_ore = 1.15 }

[[mine_types]]
id = "gold_vein"
name = "Gold Vein"
emoji = "🟡"
weight = 5
description = "Gold glints in the walls: +25% gold, the vault's too."
ore_yield = { material_gold_ore = 1.25 }

[[mine_types]]
id = "quiet_shaft"
name = "Quiet Shaft"
emoji = "🤫"
weight = 3
description = "The rock barely creaks: pressure builds more slowly."
pressure_mult = 0.93

[[mine_types]]
id = "scholars_cavern"
name = "Scholar's Cavern"
emoji = "📚"
weight = 2.5
description = "Old carvings on every wall: double mining xp."
xp_mult = 2.0

[[mine_types]]
id = "deep_pocket"
name = "Deep Pocket"
emoji = "💎"
weight = 2.5
description = "Fat lodes: more rich cells, and a little more of everything."
rich_chance_add = 0.12
yield_mult = 1.05

[[mine_types]]
id = "wyrm_tunnels"
name = "Wyrm Tunnels"
emoji = "🌀"
weight = 1
description = "The walls are riddled with burrows: wyrmholes are 10x as likely."
wyrmhole_mult = 10

[wyrmhole]
# A wyrmhole is a cell in the shaft that shows up (3 rows ahead) in place of a lode: dig it and the mine ends (the haul is yours) and you drop into the hole. What is in
# there is rolled when you enter: a SMALL one (the usual case, see [mini_wyrmhole]) or, with `big_chance`, a BIG one (below), the only place the implosion gem is.
odds = 1500                        # 1-in-N per cell between `min_depth` and `max_depth` (15 cells): about 1 mine in 100 has one
gem_bonus = 200                    # N shrinks by this for every gem placed in the reactor
min_odds = 600                     # ...but never below this
min_depth = 5                      # first row (0-based) wyrmholes can show in: below the rows you can see when a mine opens (`descent.lookahead`), so resetting mines never farms them
max_depth = 9                      # ...and the last. Deeper and a player sees one, then the mine collapses before they can reach it: never tease them
big_chance = 0.2                   # chance a wyrmhole you dig into is a big one
implosion_item = "key_gemstone_implosion"
# A big wyrmhole is a small mine of its own: no hazard and no empty cells, you dig ONE of `columns` hidden nodes on each row and keep every pick. Each row pays from
# its own pool (item = quantity). ONLY the LAST row holds a gem: one of its nodes is the implosion gem, or a reactor core gem you do not own yet. The chance it is the
# implosion gem is `implosion_base` + `implosion_per_gem` for every core gem you own (placed or in your pack); with all four it is always the implosion gem.
# `xp_per_row` is mining xp for each row dug (the multipliers apply).  TODO(balance)
columns = 3
xp_per_row = 150
implosion_base = 0.25
implosion_per_gem = 0.25
[[wyrmhole.rows]]
pool = { material_iron_ore = 60, material_tin_ore = 40, material_silver_ore = 10 }
[[wyrmhole.rows]]
pool = { material_silver_ore = 15, material_amber = 8, material_gold_ore = 5 }
[[wyrmhole.rows]]
pool = { material_gold_ore = 10, material_obsidian = 6, material_amber = 10, tool_scarab_bomb = 5 }
[[wyrmhole.rows]]
pool = { material_gold_ore = 20, material_obsidian = 10, tool_scarab_bomb = 10 }

# ---- Small wyrmholes: what most wyrmholes turn out to be (see [wyrmhole]). It is a 3-wide hole `rows` deep, no hazard and no empty cell: on each row you
# pick ONE of 3 hidden nodes, and everything you pick is banked. Each row pays from its own pool (item = quantity; the 3 hidden nodes are drawn from it), much
# better than a normal row, and better each row. No gems in here (those are the big wyrmhole's last row). `last_row_bonus` is added when you finish the last row.
# `xp_per_row` is mining xp for each row dug. A whole hole is worth several normal mines, so the odds of digging into one stay low.  TODO(balance)
[mini_wyrmhole]
xp_per_row = 120
columns = 3
last_row_bonus = { material_gold_ore = 4 }
[[mini_wyrmhole.rows]]
pool = { material_copper_ore = 70, material_iron_ore = 14, material_tin_ore = 20 }
[[mini_wyrmhole.rows]]
pool = { material_iron_ore = 20, material_tin_ore = 28, material_silver_ore = 7 }
[[mini_wyrmhole.rows]]
pool = { material_iron_ore = 26, material_silver_ore = 8, material_obsidian = 3, material_amber = 7 }
[[mini_wyrmhole.rows]]
pool = { material_silver_ore = 10, material_amber = 7, material_obsidian = 3, material_gold_ore = 4 }
[[mini_wyrmhole.rows]]
pool = { material_gold_ore = 7, material_amber = 7, material_silver_ore = 7, material_obsidian = 6 }

[reactor]
gem_slot_level = 10                # mining level needed to place gems
max_prestige = 25
prestige_per_extra_column = 5      # +1 column dug every this many reactor levels
core_gems = ["key_gemstone_sanity", "key_gemstone_rage", "key_gemstone_peace", "key_gemstone_balance"]
automine_seconds = 360             # one lode per level every 6 minutes
automine_cap_hours = 24            # lodes stop piling up after this long

[magnet]
level = 5                          # mining level needed
capacity = 1000                    # the meter holds this many points
drain_per_row = 6                  # while it is on, every row you dig uses this many (a mine is 30 rows, so a full meter is about 5 mines)
# Meter points per ore, set so a point costs about the same in bits whatever you feed (50 bits a point at today's prices): a full meter is about 50,000 bits of ore
# (1,000 copper, 167 iron or 26 gold), and following the marker is worth several times what its rows cost.  TODO(balance)
[magnet.values]
material_copper_ore = 1
material_iron_ore = 6
material_gold_ore = 38

[scarab]                           # a subterranean scarab can turn up after ANY mine (a safe exit, the vault, a collapse or a wyrmhole), holding a scrambled scroll
chance = 12                        # 1 in 12 mines (it was 1 in 51, and only after a safe exit)
seconds = 45                       # time to unscramble the scroll (it was 30)

