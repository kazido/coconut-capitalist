# Smithing: a tool is built from three PARTS (base, trim, accent) plus up to 3 TRAITS picked from the parts.
# Parts drop from skill actions. Every part type gives the SAME power for the same tier (owner decision).
# Everything here is balance data. TODO(balance) marks first guesses. Plan: docs/plans/tools-smithing.md.

part_types = ["base", "trim", "accent"]   # a tool needs exactly one part of each type

# A player in area A can roll parts of tier up to A + area_cap. Weights above that cap are ignored.
area_cap = 2
# A tool never holds more than max_traits. bonus_trait_chance adds one more trait when fewer than 3 are picked.
max_traits = 3
bonus_trait_chance = 0.25                 # TODO(balance)
cosmetic_chance = 0.10                    # chance a smithed tool gets a cosmetic look (palette/frame/overlay)
# Chance that ONE skill action (a mine banked, a fish landed, a tree felled, a crop harvested) also drops a part.
part_drop_chance = 0.01                  # TODO(balance)
# One-time reset of old tools: enchants come back as scrolls, but only this many in total per player (the strongest
# enchants first, one scroll each). Scrolls already dropped too often, so the reset must not flood players (owner decision).
legacy_scroll_cap = 2

# A part's TIER IS ITS RARITY (owner decision): 1 Common, 2 Uncommon, 3 Rare, 4 Super Rare, 5 Legendary, 6 Mythical,
# 7 Premium, 8 Celestial.
# Pace (owner): ~1 part per active hour (1% per mine run / catch / tree / harvest). Tier 7 is END GAME: none before
# area 6, and a full tier-7 tool (one of each part type, ~5.5 tier-7 drops) takes ~90 active hours in area 7. Tier 8 is near
# mythical: 1 in 5000 parts in area 7 (1 in 20000 in area 6), so most players never see one and the luckiest get one.
# Guarded by tests/test_smithing.py::test_tier_pace.
# How many traits a freshly dropped part rolls, by tier 1..8 (capped by the 3 generic part traits that exist now).
fresh_traits = [1, 1, 2, 2, 3, 3, 3, 3]   # TODO(balance)

[tiers]
# Power a part gives at tier 1..8 (index 0 = tier 1). Three tier-1 parts ~ today's starter tool power (3).
power = [1, 2, 3, 5, 7, 10, 14, 20]       # TODO(balance)

# Tier drop weights per area (8 numbers, tier 1..8). Relative: areas 1-5 add to 100, area 6 to 20000, area 7 to 5000 (so Celestial can be 1).
[[area_weights]]
area = 1
weights = [70, 25, 5, 0, 0, 0, 0, 0]       # TODO(balance)
[[area_weights]]
area = 2
weights = [40, 40, 15, 5, 0, 0, 0, 0]      # TODO(balance)
[[area_weights]]
area = 3
weights = [20, 35, 25, 15, 5, 0, 0, 0]     # TODO(balance)
[[area_weights]]
area = 4
weights = [12, 28, 32, 20, 7, 1, 0, 0]    # TODO(balance)
[[area_weights]]
area = 5
weights = [6, 16, 28, 30, 17, 3, 0, 0]       # TODO(balance)
[[area_weights]]
area = 6
weights = [499, 1800, 4000, 6000, 5000, 2400, 300, 1]       # TODO(balance)
[[area_weights]]
area = 7
weights = [50, 250, 750, 1250, 1300, 1100, 299, 1]      # TODO(balance)

# Traits: a named bonus picked from one part. `stat` is a stat name the engines already read (the same names
# enchants use). `amounts` = the value at each quality grade (Crude, Fine, Superb, Masterwork), scaled by quality mult.
# `kinds` = which tool kinds the trait fits.
# Part traits are GENERIC only (any part fits any tool kind). The skill traits (Vein Sense, Ore Bounty, Steady Hold, Sharp Cut,
# Seasoned, Lure, Deepcall, Fertile Blade, Gleaner) live on accessories now (configs/accessories.toml). TODO(balance) for more generic ones.
# Traits are STAT bonuses only. Abilities (double_hook, double_strike, seedkeeper, steady_line, soloist)
# stay enchants, one per tool. Amounts are in each stat's own unit: TODO(balance) in step 4.
[[trait]]
id = "power_core"
name = "Power Core"
stat = "power"
amounts = [1, 2, 3, 4]                    # TODO(balance)
kinds = ["pickaxe", "rod", "axe", "can"]
[[trait]]
id = "scholar_edge"
name = "Scholar's Edge"
stat = "scholar"
amounts = [1, 2, 3, 4]                    # TODO(balance)
kinds = ["pickaxe", "rod", "axe", "can"]
[[trait]]
id = "appraiser_eye"
name = "Appraiser's Eye"
stat = "appraise"
amounts = [1, 2, 3, 4]                    # TODO(balance)
kinds = ["pickaxe", "rod", "axe", "can"]
[[trait]]
id = "lucky_charm"
name = "Lucky Charm"
stat = "rare_luck"                        # fishing: rare fish likelier; mining, foraging, farming: a missed rare drop may roll again
amounts = [0.03, 0.05, 0.07, 0.10]        # TODO(balance)
kinds = ["pickaxe", "rod", "axe", "can"]
[[trait]]
id = "bountiful"
name = "Bountiful"
stat = "drop_amount"                      # bigger drops: ore (mining), tree drops, farm byproducts, extra fish (+ per catch)
amounts = [0.03, 0.05, 0.07, 0.10]        # TODO(balance)
kinds = ["pickaxe", "rod", "axe", "can"]


# Quality grades a smithed tool can get. `mult` scales the tool's power and every trait amount.
# `base_odds` are percent weights; `levels.quality_shift_per_level` moves percent points off Crude per smithing level.
[[quality]]
name = "Crude"
mult = 1.0
base_odds = 60                            # TODO(balance)
[[quality]]
name = "Fine"
mult = 1.15
base_odds = 28
[[quality]]
name = "Superb"
mult = 1.35
base_odds = 10
[[quality]]
name = "Masterwork"
mult = 1.6
base_odds = 2

[levels]
xp_per_smith = 40                         # smithing xp per tool smithed    TODO(balance)
xp_per_salvage = 15                       # smithing xp per tool salvaged
xp_per_craft = 5                          # smithing xp per item made at the Workbench (crafting is smithing's only grind)  TODO(balance)
quality_shift_per_level = 0.5             # percent points moved off Crude per smithing level (TODO(balance))
swap_unlock_level = 10                    # smithing level that unlocks swapping one part of an existing tool

# One-time reset of OLD upgrade-chain tools (services/legacy_tools.py). Each tool kind gets ONE grant: the best step the
# player reached on that kind's chain. Each grant is one base, one trim and one accent part of `tier`, each rolling `traits`
# traits to choose from. A starter (no upgrade) grants nothing. Steps: plain = 1-3 upgrades, fork = the first fork tool,
# fork_up = any upgrade after the fork.
[[legacy_grant]]
step = "plain"
tier = 2                                  # TODO(balance)
traits = 3
[[legacy_grant]]
step = "fork"
tier = 3                                  # TODO(balance)
traits = 3
[[legacy_grant]]
step = "fork_up"
tier = 4                                  # TODO(balance)
traits = 3

# RESTRICTED parts: a rare variant of any part. A tool holds at most ONE; it gets one extra enchant slot.
[restricted]
chance = 0.02                             # chance a dropped part is restricted    TODO(balance)

# Taking an enchant off a tool (you get its scroll back).
[removal]
enchant_unlock_level = 20                 # smithing level that unlocks "Remove enchant"
