# Notices: important messages for players. Each one pops up ONCE for every player, the first time they open the hub (/play or any
# shortcut) after it ships; all of them stay readable on More -> News -> Messages (newest first).
#
# When to add one: a change players may have questions about (a rework, a removed item, a new rule). Smaller changes only get a line
# in changelog.toml. Write it for players, in plain words. Never reuse or rename an `id`: seen ids are stored per player, so a new id is
# shown again to everyone and a renamed one is shown twice.
#
#   id    = short and unique (letters, digits, _)
#   date  = the day it ships (YYYY-MM-DD); the newest comes first in Messages
#   title = one line
#   body  = the message (Discord markdown, at most 1500 characters)

[[notice]]
id = "fuel_overdrive_2026_11"
date = "2026-11-19"
title = "Fuel recipes changed"
body = "Each fuel now needs the fuel before it (Rust Fuel needs a Twilight Fuel, and so on). Fuel is no longer only for the first trip: burn it on the Travel page for a timed overdrive. If you do not want to craft every step by hand, turn on **Auto-craft missing steps** in Settings."

[[notice]]
id = "tools_reset_2026_11"
date = 2026-11-19
title = "Tools are smithed now"
body = """
Tools are now built from three parts: a **base**, a **trim** and an **accent**. Parts drop from every skill, and each one can carry up to three traits. Smith them on **Tools → Smithing**.

Your old tools were replaced by free starter tools, already made from tier-1 parts. Every tool you had upgraded came back as a set of parts: the further it got, the better the parts. If your tools had enchants, your strongest two came back as scrolls.
"""

[[notice]]
id = "pet_sidekicks"
date = 2026-11-19
title = "Pets work while you are away"
body = """
Pets are more than a bonus now. Your active pet **works while you are away** and brings back skill xp: fill its **fuel tank** with crops on the Pets page, then press **Collect**. Pets you are not using add a **sidekick bonus** to it.

**Crops are fuel now, not food.** Pets level on skill food (which also gives a short xp buff), the new **Pet Biscuit** from the shop, or the **Burger** you can find while playing.

Level-ups and rare finds now appear on the result screen instead of a popup. Use **Share** to post them.
"""

[[notice]]
id = "news_page"
date = 2026-11-19
title = "News is here"
body = """
The bot can now tell you when something big changes. Messages like this one pop up once, the first time you open the menu after a change ships.

Missed one? Every message stays on **More → News**, next to a **Changelog** of everything that has changed lately.
"""
