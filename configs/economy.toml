# The two-economy rules (see docs/DESIGN.md).
#   bits       = power: skills, work, selling, drops. Buys tools, seeds, land, enchants.
#   luckbucks  = fun: minigames, the weekly bonus and gambling. Buys cosmetics. Staked in the casino.
# Minigames can be played all day, so what they pay is capped per UTC day.

# +xp in EVERY skill while you are in a party, growing with its size: the first number is for 2 members, the next for 3,
# and the last for that many members or more (so a party of 4 or more gets +50%).  # TODO(balance)
party_xp_bonus_by_size = [0.10, 0.25, 0.50]
# Parties only help while their members play: someone who has not pressed any button or command for this many hours is
# taken out of their party (the party goes to its most recently active member if it was theirs).
party_idle_hours = 24
starting_luckbucks = 100
weekly_luckbucks = 100

[minigames]
daily_cap = 300                    # max luckbucks per player per day from ALL minigames combined
streak_bonus = 0.10                # +10% per consecutive win...
streak_bonus_max_steps = 9         # ...up to +90% (x1.9)

[minigames.payout]                 # luckbucks per win, before the streak bonus
flashcard_add = 4
flashcard_sub = 6
flashcard_mul = 10
unscramble_per_letter = 1.5
sequence_per_element = 1           # x difficulty multiplier below
trivia_easy = 3
trivia_medium = 6
trivia_hard = 10

[minigames.sequence_difficulty]    # multiplier per element for easy / medium / hard
easy = 1
medium = 2
hard = 3

[exchange]
bits_per_luckbuck = 5000           # one-way: bits -> luckbucks (a bit sink)
daily_limit = 500                  # luckbucks per player per day

[pets]
max_level = 20
xp_scale = 500                     # level 2 at 500 xp, 5 at 8,000, 10 at 40,500, 20 at 180,500
max_stars = 5
star_bonus = 0.25                  # +25% bonus per extra star
level_floor = 0.5                  # a fresh pet does half its bonus; a max level one does all of it
spirit_bonus = 0.15                # a Spirit adds +15% xp in its skill while the pet is active
maxed_xp = 2000
target_boost = 8.0                 # a pet you are hunting is this many times likelier from an orb...
pity_boost = 1.0                   # ...and +1 more for every orb that missed it (reset when you get it)
max_boost = 40.0                   # ...up to this many times
[pets.orb_weights]                 # what an orb can turn out to be
1 = 40
2 = 30
3 = 20
4 = 8
5 = 2
