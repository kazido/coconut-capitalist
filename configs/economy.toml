# The two-economy rules (see docs/DESIGN.md).
#   bits       = power: skills, work, selling, drops. Buys tools, seeds, land, enchants.
#   luckbucks  = fun: minigames, the weekly bonus and gambling. Buys cosmetics. Staked in the casino.
# Minigames can be played all day, so what they pay is capped per UTC day.

# +xp in EVERY skill while you are in a party, growing with its size: the first number is for 2 members, the next for 3,
# and the last for that many members or more (so a party of 4 or more gets +50%).  # TODO(balance)
# Tokens (they buy ranks) come 1 a day from the daily, and now also at random while you play: every hour you press anything there is
# this chance of finding one (rolled once an hour, seeded, so reopening or restarting cannot reroll it). About 3 active hours a day
# is roughly +1 a day, so a regular player earns about 2 tokens a day in all.
token_drop_chance = 0.35
party_xp_bonus_by_size = [0.10, 0.25, 0.50]
# Parties only help while their members play: someone who has not pressed any button or command for this many hours is
# taken out of their party (the party goes to its most recently active member if it was theirs).
party_idle_hours = 0.1
starting_luckbucks = 0
weekly_luckbucks = 25

# Starred materials (see docs/plans/starred-materials.md): each id below also exists as <id>_s2 and <id>_s3 (own inventory stacks, never crafted up).
# The plain id is the 1-star one. Start small: add a material here only when an upgrade needs its stars.
[stars]
sell_multipliers = [1.0, 2.5, 6.0]  # sell price of 1, 2 and 3 stars x the base price  TODO(balance)
starrable = ["iron_ore", "gold_ore", "silver_ore", "platinum_ore", "hardwood", "fine_bark", "maple_leaf", "coral_shard", "beeswax", "living_vine"]

# Which star a starrable drop is, by how deep you are (progress 0 = first forest / top of the mine / shallowest water, 1 = the deepest).
# Weights are 1-star / 2-star / 3-star, blended in a straight line between points. 2-star can turn up early but rarely and is the main drop from
# the middle on; 3-star is never the majority anywhere (the registry refuses it). TODO(balance): all numbers
[[stars.curve]]
progress = 0.0
weights = [97, 3, 0]
[[stars.curve]]
progress = 0.25
weights = [75, 24, 1]
[[stars.curve]]
progress = 0.5
weights = [40, 55, 5]
[[stars.curve]]
progress = 0.75
weights = [25, 60, 15]
[[stars.curve]]
progress = 1.0
weights = [15, 65, 20]

[minigames]
daily_cap = 300                    # max luckbucks per player per day from ALL minigames combined
streak_bonus = 0.10                # +10% per consecutive win...
streak_bonus_max_steps = 9         # ...up to +90% (x1.9)

[minigames.payout]                 # luckbucks per win, before the streak bonus
flashcard_add = 4
flashcard_sub = 6
flashcard_mul = 10
unscramble_per_letter = 1.5
sequence_per_element = 1           # x difficulty multiplier below
trivia_easy = 3
trivia_medium = 6
trivia_hard = 10

[minigames.sequence_difficulty]    # multiplier per element for easy / medium / hard
easy = 1
medium = 2
hard = 3

[exchange]
bits_per_luckbuck = 5000           # one-way: bits -> luckbucks (a bit sink)
daily_limit = 500                  # luckbucks per player per day

[pets]
max_level = 100
max_stars = 5
star_bonus = 0.25                  # +25% bonus per extra star
level_floor = 0.1                  # a fresh pet does a tenth of its bonus; a level 100 one does all of it (so a pet grows about 10x as strong)
play_xp_share = 0.5                # your active pet gains this share of the skill xp you earn in ITS skill (like Skyblock pets: they level as you play)...
play_xp_global = 0.25              # ...a global pet gains this share of the xp from ANY skill. Other pets only level from food.
spirit_bonus = 0.15                # a Spirit adds +15% xp in its skill while the pet is active
# Skill food (items with category "pet_food", dropped by their skill) is worth `food_xp` by tier. A pet you assigned to that skill
# gets it x3; a pet with no skill ("global") gets any food x2; anything else only the plain amount. Crops are farming food.
food_xp = [200, 1000, 5000]
matched_food_multiplier = 3.0
global_food_multiplier = 2.0
maxed_xp = 2000
target_boost = 8.0                 # a pet you are hunting is this many times likelier from an orb...
pity_boost = 1.0                   # ...and +1 more for every orb that missed it (reset when you get it)
max_boost = 40.0                   # ...up to this many times
[pets.xp_scale]                    # a pet's level = 1 + sqrt(xp / its rarity's scale): common pets level quickest, rare ones slowest. TODO(balance)
# Rarity 3 (300): level 2 at 300 xp, 10 at 24,300, 20 at 108,300, 50 at 720,300, 100 at 2,940,300. Rarity 1 needs half of that, rarity 5 double.
1 = 150
2 = 200
3 = 300
4 = 450
5 = 600
# What each kind of orb can turn out to be: one table per orb item (an item in items.toml whose id ends `_orb`), keyed by pet rarity.
# Each rarity's weight is shared among its species. The standard Familiar Orb is the baseline; the Lesser one is cheap and mostly
# gives common pets, the Greater one costs 10x and mostly gives rare ones. TODO(balance)
[pets.orbs.lesser_orb]
1 = 55
2 = 35
3 = 9
4 = 1
5 = 0
[pets.orbs.familiar_orb]
1 = 40
2 = 30
3 = 20
4 = 8
5 = 2
[pets.orbs.greater_orb]
1 = 0
2 = 5
3 = 20
4 = 50
5 = 25
